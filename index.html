        <div class="sets">${it.sets.map((s, j) => `<div class="set" data-row><span class="i">${j+1}</span><input data-k="r" inputmode="text" value="${esc(s.r ?? '')}" aria-label="${M1[m.m1] || 'Reps'} serie ${j+1}"${none ? ' style="grid-column:span 2"' : ''}>${none ? '' : `<input data-k="${k}" inputmode="${M2[m.m2]?.[1] || 'decimal'}" value="${esc(s[k] ?? '')}" aria-label="${lab} serie ${j+1}"${m.m2 === 'banda' ? ' placeholder="color"' : ''}>`}<button type="button" class="ok" aria-pressed="${s.ok ? 'true' : 'false'}" aria-label="Serie hecha">✓</button><button type="button" class="icon ghost" data-rmset="${i}:${j}" aria-label="Quitar serie">−</button></div>`).join('')}</div>`; })()}

  const inner = `<div class="row"><span class="chip"><i class="dot c-${esc(isFree ? 'libre' : p?.color || '')}"></i>${esc(isFree ? 'Sesión libre' : p?.name || existing?.programName || '')}</span><span class="muted small">${fmtD(date)}</span></div>
    ${isFree ? `<label class="f"><span class="label">Nombre de la sesión</span><input id="lg-name" value="${esc(existing?.dayName || 'Sesión libre')}"></label>` : ''}
    <datalist id="exnames">${known.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div id="lg-list" style="display:flex;flex-direction:column;gap:10px"></div>
    <button class="dashed" type="button" id="lg-addex" style="min-height:48px;font-size:15px">+ Añadir ejercicio</button>
    <section class="card soft">
      <div class="fgrid"><label class="f"><span class="label">Duración (min)</span><input id="lg-dur" type="number" inputmode="numeric" value="${existing?.duration ?? ''}" placeholder="${live ? 'automática' : ''}"></label>
      <label class="f"><span class="label">Sensación</span><select id="lg-feel">${['—', '1 · Muy mal', '2 · Flojo', '3 · Normal', '4 · Bien', '5 · Excelente'].map((o, k) => `<option value="${k || ''}"${String(existing?.feel ?? '') === String(k || '') ? ' selected' : ''}>${o}</option>`).join('')}</select></label></div>
      <label class="f"><span class="label">Notas (molestias, cardio HIIT, sensaciones)</span><textarea id="lg-notes">${esc(existing?.notes || '')}</textarea></label>
      ${p && p.kind !== 'joints' ? `<label class="row small"><input id="lg-upd" type="checkbox" checked style="width:auto"> Si subí de peso, actualizar el objetivo de la rutina</label>` : ''}</section>

      <div class="presets">${[60, 90, 120, 180].map(s => `<button type="button" data-rest="${s}">${s < 120 ? s + '"' : s/60 + "'"}</button>`).join('')}<button type="button" id="rest-auto" aria-pressed="true" title="Iniciar solo al marcar una serie">Auto ✓</button></div>
    </div></div>`;
  openSheet(dayName, inner, sh => {
    const list = $('#lg-list', sh);
    const sync = () => $$('.exl[data-i]', list).forEach(el => { const it = items[+el.dataset.i]; const nm = $('[data-k="name"]', el); if (nm) it.name = nm.value; it.sets = $$('.set[data-row]', el).map(r => ({ r: $('[data-k="r"]', r).value.trim(), w: $('[data-k="w"]', r)?.value.trim() ?? '', x: $('[data-k="x"]', r)?.value.trim() ?? '', ok: $('.ok', r).getAttribute('aria-pressed') === 'true' })); });
    const draw = () => { list.innerHTML = exHtml(); };
    draw();
    let iv = null;
    // ---- rest timer: counts down from an end timestamp, so it stays right after switching to Spotify and back ----
    const getPref = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
    const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
    const rest = { dur: Number(getPref('tg-rest', 90)) || 90, end: null, left: null, done: false };
    rest.left = rest.dur;
    let auto = getPref('tg-rest-auto', '1') === '1';
    let actx = null, wl = null;
    const ensureAudio = () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} };
    const beep = () => {
      try { navigator.vibrate?.([250, 120, 250]); } catch (e) {}
      if (!actx) return;
      [0, 0.28, 0.56].forEach((o, i) => { const os = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + o; os.frequency.value = i === 2 ? 1320 : 880; os.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.45, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.2); os.start(s); os.stop(s + 0.22); });
    };
    const fmtT = s => { const c = Math.max(0, Math.ceil(s)); return `${Math.floor(c / 60)}:${pad(c % 60)}`; };
    const restEl = $('#rest', sh);
    const paint = () => {
      const left = rest.end ? (rest.end - Date.now()) / 1000 : rest.left;
      $('#rest-t', sh).textContent = rest.done ? '0:00' : fmtT(left);
      $('#rest-bar', sh).style.width = `${Math.max(0, Math.min(1, left / rest.dur)) * 100}%`;
      $('#rest-s', sh).textContent = rest.end ? 'Descansando · tocar para pausar' : rest.done ? '¡A darle! Siguiente serie' : left < rest.dur ? 'En pausa · tocar para seguir' : 'Descanso · tocar para iniciar';
      restEl.classList.toggle('running', !!rest.end); restEl.classList.toggle('done', rest.done);
      $$('[data-rest]', sh).forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.rest) === rest.dur));
      $('#rest-auto', sh).setAttribute('aria-pressed', auto);
    };
    const restStart = d => { ensureAudio(); if (d) rest.dur = d; rest.done = false; rest.end = Date.now() + rest.dur * 1000; paint(); };
    const restTick = setInterval(() => { if (rest.end && Date.now() >= rest.end) { rest.end = null; rest.left = rest.dur; rest.done = true; beep(); } paint(); }, 250);
    $('#rest-go', sh).addEventListener('click', () => {
      ensureAudio();
      if (rest.end) { rest.left = Math.max(0, (rest.end - Date.now()) / 1000); rest.end = null; }
      else if (rest.done || rest.left <= 0) restStart();
      else { rest.end = Date.now() + rest.left * 1000; rest.done = false; }
      paint();
    });
    const nudge = sec => {
      if (rest.end) rest.end = Math.max(Date.now() + 1000, rest.end + sec * 1000);
      else if (!rest.done && rest.left === rest.dur) { rest.dur = rest.left = Math.max(15, rest.dur + sec); setPref('tg-rest', rest.dur); }
      else rest.left = Math.max(0, rest.left + sec);

    };
    $('#rest-minus', sh).addEventListener('click', () => nudge(-15));
    $('#rest-plus', sh).addEventListener('click', () => nudge(15));
    $$('[data-rest]', sh).forEach(b => b.addEventListener('click', () => { const v = Number(b.dataset.rest); setPref('tg-rest', v); rest.left = v; restStart(v); }));
    $('#rest-auto', sh).addEventListener('click', () => { auto = !auto; setPref('tg-rest-auto', auto ? '1' : '0'); paint(); toast(auto ? 'El descanso empieza solo al marcar ✓ una serie' : 'Descanso manual'); });
    paint();
    try { navigator.wakeLock?.request('screen').then(x => wl = x).catch(() => {}); } catch (e) {}
    if (live) { const tm = $('#lg-timer', sh); iv = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); if (tm) tm.textContent = `${pad(Math.floor(s/60))}:${pad(s%60)}`; }, 1000); }
    sh.addEventListener('click', ev => {
      const a = ev.target.closest('[data-addset]');
      if (a) { sync(); const it = items[+a.dataset.addset]; const l = it.sets[it.sets.length-1] || { r: '', w: '', x: '' }; it.sets.push({ r: l.r, w: l.w ?? '', x: l.x ?? '', ok: false }); draw(); return; }
      const rs = ev.target.closest('[data-rmset]');
      if (rs) { sync(); const [i, j] = rs.dataset.rmset.split(':').map(Number); items[i].sets.splice(j, 1); draw(); return; }
      const rx = ev.target.closest('[data-rmex]');
      if (rx) { sync(); items.splice(+rx.dataset.rmex, 1); draw(); return; }
      const ok = ev.target.closest('.ok');
      if (ok) { const on = ok.getAttribute('aria-pressed') !== 'true'; ok.setAttribute('aria-pressed', on ? 'true' : 'false'); if (on && auto) { rest.left = rest.dur; restStart(); } return; }
    });
    $('#lg-addex', sh).addEventListener('click', () => { sync(); items.push({ name: '', block: '', tag: '', target: {}, sets: [{ r: '', w: '', x: '', ok: false }], last: null, custom: true, m: { m1: 'reps', m2: 'kg' } }); draw(); const ins = $$('[data-k="name"]', list); ins[ins.length-1]?.focus(); });
    list.addEventListener('change', ev => {
      if (ev.target.dataset.k !== 'name') return;
      sync(); const i = +ev.target.closest('.exl').dataset.i; const it = items[i];
      if (it.name) {
        it.m = exMetric({ name: it.name });
        if (!it.last) { it.last = lastLogFor(it.name, date, existing?.id); if (it.last?.e.m2) it.m = exMetric({ name: it.name, m1: it.last.e.m1, m2: it.last.e.m2 }); if (it.last && it.sets.length === 1 && !it.sets[0].r && !it.sets[0].w && !it.sets[0].x) it.sets = it.last.e.sets.map(s => ({ r: s.r, w: s.w ?? '', x: s.x ?? '', ok: false })); }

      }
    });
    $('#lg-save', sh).addEventListener('click', async () => {
      sync();
      const entries = items.filter(it => it.name.trim()).map(it => {
        const m = it.m || exMetric({ name: it.name }), kg = isKg(m.m2), txt = M2[m.m2]?.[1] === 'text';
        return { name: it.name.trim(), block: it.block, tag: it.tag, target: it.target || {}, m1: m.m1, m2: m.m2,
          sets: it.sets.map(s => { const o = { r: s.r, w: kg ? num(s.w) : null, ok: s.ok }; if (!kg && m.m2 !== 'none' && s.x !== '' && s.x != null) o.x = txt ? String(s.x).trim() : num(s.x); return o; })
            .filter(s => s.r !== '' || s.w != null || (s.x != null && s.x !== '')) };
      });
      const progId = isFree ? 'libre' : p?.id || existing?.programId;
      let id = existing?.id || `${date}_${progId}_${isFree ? uid() : day.id}`;
      if (!existing && S.workouts.some(w => w.id === id)) id += '_' + uid();
      const dur = num($('#lg-dur', sh).value) ?? (live ? Math.max(1, Math.round((Date.now() - t0) / 60000)) : null);
      const doc = { date, programId: progId, programName: isFree ? 'Sesión libre' : p?.name || existing?.programName || '', dayId: isFree ? 'libre' : day?.id || existing?.dayId,
        dayName: isFree ? ($('#lg-name', sh).value.trim() || 'Sesión libre') : dayName, entries, notes: $('#lg-notes', sh).value.trim(), feel: num($('#lg-feel', sh).value),
        duration: dur, createdAt: existing?.createdAt || Date.now(), updatedAt: Date.now() };

    return () => { clearInterval(iv); clearInterval(restTick); try { wl?.release(); actx?.close(); } catch (e) {} };
  }, live ? `<span class="timer" id="lg-timer" aria-live="off">00:00</span>` : '');
}

/* ---------- body ---------- */
function openBody(date) {

  const inner = `<section class="card soft"><label class="f"><span class="label">Fecha</span><input id="bd-date" type="date" value="${date}"></label>
    <div class="fgrid">${fields}</div>
    <label class="f"><span class="label">Notas</span><textarea id="bd-notes" placeholder="Cómo te ves, cómo te sientes…">${esc(b.notes || '')}</textarea></label>
    ${S.assets ? `<label class="f"><span class="label">Foto de progreso</span><input id="bd-photo" type="file" accept="image/*"></label>${b.photo ? `<div class="photos"><figure><img src="${esc(__img(b.photo))}" alt="Foto actual"><figcaption>Foto actual</figcaption></figure></div>` : ''}` : ''}
    </section><div class="row"><button class="primary grow" id="bd-save">Guardar</button>${b.date ? '<button class="danger" id="bd-del">Borrar</button>' : ''}</div>`;
  openSheet('Medidas', inner, sh => {
    $('#bd-save', sh).addEventListener('click', async () => {
      const btn = $('#bd-save', sh); btn.disabled = true;
      const d = $('#bd-date', sh).value || date;
      const doc = { date: d, notes: $('#bd-notes', sh).value.trim(), updatedAt: Date.now() };
      Object.keys(METRICS).forEach(k => { const v = num($(`#bd-${k}`, sh).value); if (v != null) doc[k] = v; });
      if (b.photo) doc.photo = b.photo;
      const f = $('#bd-photo', sh)?.files?.[0];
      if (f && S.assets) {
        try { btn.textContent = 'Subiendo foto…'; const r = await S.assets.upload(f); doc.photo = { id: r.id, url: r.url }; }
        catch (e) { toast('No se pudo subir la foto (máx. 20 MB).'); btn.disabled = false; btn.textContent = 'Guardar'; return; }
      }
      const ok = await write(async db => { await db.doc('body/' + d).set(doc); if (b.date && b.date !== d) await db.doc('body/' + b.date).delete(); }, 'Medidas guardadas');
      if (ok) closeSheet(); else { btn.disabled = false; btn.textContent = 'Guardar'; }
    });

      if (del.dataset.armed !== '1') { del.dataset.armed = '1'; del.textContent = 'Confirmar borrado'; return; }
      if (await write(db => db.doc('body/' + b.date).delete(), 'Medición borrada')) closeSheet();
    });
  });
}

/* ---------- joints ---------- */

  const j = S.joints.find(x => x.id === jid) || S.joints[0];
  const inner = `<section class="card soft">
    <label class="f"><span class="label">Articulación</span><select id="jt-id">${S.joints.map(x => `<option value="${esc(x.id)}"${x === j ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="__new">+ Añadir otra…</option></select></label>
    <div class="fgrid" id="jt-new" hidden><label class="f"><span class="label">Nombre</span><input id="jt-name" placeholder="Hombro derecho"></label><label class="f"><span class="label">Prueba de movilidad</span><input id="jt-test" placeholder="Ej. rotación externa"></label><label class="f"><span class="label">Unidad</span><input id="jt-unit" placeholder="cm / grados / reps"></label></div>
    <label class="f"><span class="label">Fecha</span><input id="jt-date" type="date" value="${today()}"></label>
    <label class="f"><span class="label">Dolor: <b id="jt-pv">0</b>/10</span><input id="jt-pain" type="range" min="0" max="10" step="1" value="0" style="padding:0;border:0;accent-color:var(--accent)"></label>
    <label class="f"><span class="label" id="jt-vlabel">Resultado de la prueba</span><input id="jt-val" type="text" inputmode="decimal" placeholder="opcional"></label>
    <label class="f"><span class="label">Nota</span><input id="jt-note" placeholder="Ej. molestia al hacer dominadas"></label>
  </section><button class="primary" id="jt-save">Guardar</button>`;
  openSheet('Articulaciones', inner, sh => {
    const sync = () => { const v = $('#jt-id', sh).value; $('#jt-new', sh).hidden = v !== '__new'; const jj = S.joints.find(x => x.id === v); $('#jt-vlabel', sh).textContent = jj?.test ? `${jj.test}${jj.unit ? ' (' + jj.unit + ')' : ''}` : 'Resultado de la prueba'; };
    $('#jt-id', sh).addEventListener('change', sync); sync();
    $('#jt-pain', sh).addEventListener('input', e => $('#jt-pv', sh).textContent = e.target.value);
    $('#jt-save', sh).addEventListener('click', async () => {
      let id = $('#jt-id', sh).value, jj;
      if (id === '__new') { const name = $('#jt-name', sh).value.trim(); if (!name) { toast('Escribe el nombre de la articulación.'); return; } id = norm(name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || uid(); jj = { name, test: $('#jt-test', sh).value.trim(), unit: $('#jt-unit', sh).value.trim(), order: S.joints.length, logs: [] }; }
      else jj = clone(S.joints.find(x => x.id === id));
      const log = { date: $('#jt-date', sh).value || today(), pain: Number($('#jt-pain', sh).value), value: num($('#jt-val', sh).value), note: $('#jt-note', sh).value.trim() };
      jj.logs = (jj.logs || []).filter(l => l.date !== log.date).concat([log]).sort((a,b) => a.date.localeCompare(b.date));
      if (await write(db => db.doc('joints/' + id).set(body(jj)), 'Registro guardado')) closeSheet();
    });
  });
}

/* ---------- program editor ---------- */
function openEditor(pid) {
  const src = prog(pid);
  const draft = src ? clone(src) : { id: uid(), name: 'Nueva rutina', subtitle: '', color: 'ink', kind: 'gym', notes: '', order: S.programs.length, days: [{ id: uid(), name: 'Día 1', weekday: 1, blocks: [{ id: uid(), title: '', tag: '', exercises: [] }] }] };
  const draw = sh => {
    $('#ed-body', sh).innerHTML = `<section class="card soft"><div class="fgrid">
        <label class="f"><span class="label">Nombre</span><input data-path="name" value="${esc(draft.name)}"></label>
        <label class="f"><span class="label">Descripción</span><input data-path="subtitle" value="${esc(draft.subtitle||'')}"></label>
        <label class="f"><span class="label">Color</span><select data-path="color">${Object.entries(COLORS).map(([c, n]) => `<option value="${c}"${draft.color === c ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="f"><span class="label">Tipo</span><select data-path="kind"><option value="gym"${draft.kind !== 'joints' ? ' selected' : ''}>Rutina principal</option><option value="joints"${draft.kind === 'joints' ? ' selected' : ''}>Complementaria (movilidad)</option></select></label></div>
      <label class="f"><span class="label">Notas generales</span><textarea data-path="notes">${esc(draft.notes||'')}</textarea></label></section>
      ${draft.days.map((d, di) => `<div class="dayed"><div class="fgrid"><label class="f"><span class="label">Día</span><input data-path="days.${di}.name" value="${esc(d.name)}"></label>
        <label class="f"><span class="label">Día de la semana</span><select data-path="days.${di}.weekday" data-type="weekday"><option value="">Sin día fijo</option>${[1,2,3,4,5,6,0].map(w => `<option value="${w}"${d.weekday === w ? ' selected' : ''}>${DOW[w]}</option>`).join('')}</select></label></div>
        ${(d.blocks||[]).map((b, bi) => `<div class="blked"><div class="row"><input class="grow" data-path="days.${di}.blocks.${bi}.title" value="${esc(b.title||'')}" placeholder="Bloque (ej. Hipertrofia, Core)" aria-label="Nombre del bloque"><select data-path="days.${di}.blocks.${bi}.tag" style="width:auto" aria-label="Color del bloque">${['', 'HIPERTROFIA', 'CORE', 'POTENCIA', 'MOVILIDAD'].map(t => `<option value="${t}"${b.tag === t ? ' selected' : ''}>${t || 'Etiqueta…'}</option>`).join('')}</select><button class="icon ghost" data-ed="rmblock" data-di="${di}" data-bi="${bi}" aria-label="Borrar bloque" style="color:var(--bad)">×</button></div>
          <div class="edrow edhead"><span>Ejercicio</span><span>Series</span><span>Reps</span><span>Kg</span><span></span></div>
          ${(b.exercises||[]).map((ex, ei) => { const pth = `days.${di}.blocks.${bi}.exercises.${ei}`; return `<div class="edrow"><input data-path="${pth}.name" value="${esc(ex.name)}" aria-label="Ejercicio"><input data-path="${pth}.sets" data-type="num" inputmode="numeric" value="${ex.sets ?? ''}" aria-label="Series"><input data-path="${pth}.reps" value="${esc(ex.reps ?? '')}" aria-label="Reps"><input data-path="${pth}.weight" data-type="num" inputmode="decimal" value="${ex.weight ?? ''}" aria-label="Kg"><button class="icon ghost" data-ed="rmex" data-di="${di}" data-bi="${bi}" data-ei="${ei}" aria-label="Quitar">×</button></div>
            <div class="row" style="gap:6px;flex-wrap:nowrap;margin-top:-2px"><input class="grow" data-path="${pth}.note" value="${esc(ex.note||'')}" placeholder="Nota (opcional)" style="font-size:13px;padding:5px 8px" aria-label="Nota">
            <select data-path="${pth}.m2" style="width:auto;font-size:13px;padding:5px 6px" aria-label="Qué se anota además de las reps">${(() => { const auto = exMetric({ name: ex.name, reps: ex.reps }).m2; return [['', `Auto · ${M2[auto][0]}`], ...Object.entries(M2).map(([k, v]) => [k, v[0]])].map(([k, l]) => `<option value="${k}"${(ex.m2 || '') === k ? ' selected' : ''}>${l}</option>`).join(''); })()}</select></div>`; }).join('')}
          <button class="sm ghost" data-ed="addex" data-di="${di}" data-bi="${bi}" style="align-self:flex-start">+ Ejercicio</button></div>`).join('')}
        <div class="row"><button class="sm" data-ed="addblock" data-di="${di}">+ Bloque</button><button class="sm danger" data-ed="rmday" data-di="${di}">Borrar día</button></div></div>`).join('')}
      <button class="dashed" data-ed="addday">+ Añadir día</button>`;
  };
  const inner = `<div id="ed-body" style="display:flex;flex-direction:column;gap:12px"></div><div class="row"><button class="primary grow" id="ed-save">Guardar rutina</button>${src ? '<button class="danger" id="ed-del">Borrar rutina</button>' : ''}</div>`;
  openSheet(src ? 'Editar rutina' : 'Nueva rutina', inner, sh => {
    draw(sh);
    const onInput = ev => {
      const el = ev.target, path = el.dataset?.path; if (!path) return;
      let v = el.value; if (el.dataset.type === 'num') v = num(v); if (el.dataset.type === 'weekday') v = v === '' ? null : Number(v);
      const ks = path.split('.'); let o = draft; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length-1]] = v;
    };
    sh.addEventListener('input', onInput); sh.addEventListener('change', onInput);
    sh.addEventListener('click', ev => {
      const b = ev.target.closest('[data-ed]'); if (!b) return;
      const { di, bi, ei } = b.dataset; const D = draft.days;
      switch (b.dataset.ed) {
        case 'addex': D[di].blocks[bi].exercises.push({ id: uid(), name: '', sets: 2, reps: '', weight: null, note: '' }); break;
        case 'rmex': D[di].blocks[bi].exercises.splice(ei, 1); break;
        case 'addblock': D[di].blocks.push({ id: uid(), title: '', tag: '', exercises: [] }); break;
        case 'rmblock': D[di].blocks.splice(bi, 1); break;
        case 'addday': D.push({ id: uid(), name: 'Día ' + (D.length + 1), weekday: null, blocks: [{ id: uid(), title: '', tag: '', exercises: [] }] }); break;
        case 'rmday': if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Confirmar'; return; } D.splice(di, 1); break;
      }
      const y = sh.scrollTop; draw(sh); sh.scrollTop = y;
      if (b.dataset.ed === 'addex') { const rows = $$(`[data-path^="days.${di}.blocks.${bi}.exercises."][data-path$=".name"]`, sh); rows[rows.length-1]?.focus(); }
    });
    $('#ed-save', sh).addEventListener('click', async () => {
      draft.days.forEach(d => d.blocks.forEach(b => b.exercises = b.exercises.filter(e => (e.name||'').trim())));
      if (await write(db => db.doc('programs/' + draft.id).set(body(draft)), 'Rutina guardada')) closeSheet();
    });
    const del = $('#ed-del', sh);
    if (del) del.addEventListener('click', async () => {
      if (del.dataset.armed !== '1') { del.dataset.armed = '1'; del.textContent = 'Confirmar (tus sesiones se conservan)'; return; }
      if (await write(db => db.doc('programs/' + draft.id).delete(), 'Rutina borrada')) closeSheet();
    });
  });
}

/* ---------- events ---------- */
$('#theme').addEventListener('click', () => {
  const r = document.documentElement, cur = r.getAttribute('data-theme') || 'dark';
  const nx = cur === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', nx);
  try { localStorage.setItem('tg-theme', nx); } catch (e) {}
});
document.addEventListener('click', ev => {
  if (ev.target.closest('[data-close]')) { closeSheet(); return; }
  const tb = ev.target.closest('nav.tabs button'); if (tb) { S.tab = tb.dataset.tab; try { localStorage.setItem('tg-tab', S.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const ds = a.dataset;
  switch (ds.act) {
    case 'tab': S.tab = ds.v; render(); break;
    case 'log': openLogger(ds); break;
    case 'day': openDay(ds.date); break;
    case 'mon': S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + Number(ds.v), 1); render(); break;
    case 'body': openBody(ds.date); break;
    case 'joint': openJoint(ds.j); break;
    case 'metric': S.bodyMetric = ds.v; render(); break;
    case 'seg': S.progSeg = ds.v; render(); break;
    case 'checkin': openCheckin(ds.date); break;
    case 'pose': S.ciPose = ds.v; render(); break;
    case 'gorev': S.tab = 'prog'; S.progSeg = 'rev'; try { localStorage.setItem('tg-tab', S.tab); } catch (e) {} render(); window.scrollTo(0, 0); break;
    case 'gate': { const c = { ...(S.plan.checks || {}) }; if (c[ds.g]) delete c[ds.g]; else c[ds.g] = today(); savePlan({ checks: c }); break; }
    case 'advance': {
      if (ds.armed !== '1') { a.dataset.armed = '1'; a.textContent = 'Confirmar: pasar de fase sin cumplir todo'; break; }
      const ph = S.plan.phases, ci = ph.findIndex(x => x.id === S.plan.currentPhase);
      if (ci < ph.length - 1) savePlan({ currentPhase: ph[ci + 1].id, phaseStart: today() }, `Empieza la fase ${ci + 1}: ${ph[ci + 1].name}`);
      window.scrollTo(0, 0); break;
    }
    case 'gophase': { const x = S.plan.phases[+ds.i]; if (x) savePlan({ currentPhase: x.id, phaseStart: today() }, `Fase actual: ${x.name}`); window.scrollTo(0, 0); break; }
    case 'alt': {
      const cur = S.settings.alt?.[ds.k] || '';
      let v = ds.v || '';
      if (v === cur) { const opts = [...a.parentElement.querySelectorAll('[data-v]')].map(b => b.dataset.v || ''); v = opts[(opts.indexOf(cur) + 1) % opts.length]; }
      S.settings = { ...S.settings, alt: { ...(S.settings.alt || {}), [ds.k]: v } };
      render();
      write(db => db.doc('settings/main').set({ stepGoal: 10000, ...S.settings }));
      break;
    }
    case 'edit': openEditor(ds.p); break;
    case 'rseg': S.regSeg = ds.v; try { localStorage.setItem('tg-regseg', ds.v); } catch (e) {} render(); window.scrollTo(0, 0); break;
    case 'ndate': { const nd = dayShift(S.nutDate || today(), Number(ds.v)); if (nd <= today()) { S.nutDate = nd; render(); } break; }
    case 'gonut': closeSheet(); S.tab = 'reg'; S.regSeg = 'nut'; S.nutDate = ds.date; try { localStorage.setItem('tg-tab', 'reg'); localStorage.setItem('tg-regseg', 'nut'); } catch (e) {} render(); window.scrollTo(0, 0); break;
    case 'goals': openGoals(); break;
    case 'fadd': openFoodPicker(ds.m, S.nutDate || today()); break;
    case 'fitem': openFoodItem(S.nutDate || today(), ds.id); break;
    case 'fcopy': { const d = S.nutDate || today(), pv = (foodOn(dayShift(d, -1))?.items || []).filter(i => i.m === ds.m); const day = clone(foodOn(d) || { items: [], water: 0 }); day.items.push(...pv.map(i => ({ ...clone(i), id: uid() }))); saveFoodDay(d, day, `${mealName(ds.m)} copiado de ayer`); break; }
    case 'water': { const d = S.nutDate || today(), day = clone(foodOn(d) || { items: [], water: 0 }); day.water = Math.max(0, (day.water || 0) + Number(ds.v)); saveFoodDay(d, day); break; }
    case 'nadj': { const N = clone(S.settings.nutri), a = Number(ds.v); N.t.kcal += a; N.t.c = Math.max(0, N.t.c + Math.round(a / 4)); N.adj = (N.adj || 0) + a; N.at = N.at || today(); const doc = { ...S.settings, nutri: N }; S.settings = doc; render(); write(db => db.doc('settings/main').set(doc), `Calorías ajustadas a ${fmtI(N.t.kcal)} kcal`); break; }
    case 'activate': write(db => db.doc('settings/main').set({ stepGoal: 10000, ...S.settings, activeProgram: ds.p }), 'Rutina activada'); break;
  }
});
document.addEventListener('toggle', ev => { if (ev.target.id === 'nut-micros') S.nutMicros = ev.target.open; }, true);
document.addEventListener('change', ev => {
  const id = ev.target.id, map = { 'prog-ex': 'progEx', 'ci-a': 'ciA', 'ci-b': 'ciB', 'ci-m': 'ciM' };
  if (map[id]) { S[map[id]] = ev.target.value; ev.target.blur(); render(); }
});
document.addEventListener('submit', async ev => {
  const f = ev.target; ev.preventDefault();
  if (f.dataset.form === 'steps') {
    const v = num($('input', f).value), date = f.dataset.date, mk = date.slice(0, 7);
    const days = { ...(S.steps[mk]?.days || {}) };
    if (v == null) delete days[date.slice(8)]; else days[date.slice(8)] = Math.round(v);
    $('input', f).blur();
    await write(db => db.doc('steps/' + mk).set({ days }), v != null && v >= stepGoal() ? 'Pasos guardados · meta cumplida' : 'Pasos guardados');
  }
  if (f.dataset.form === 'settings') {
    const doc = { ...S.settings, heightCm: num($('#set-height').value), stepGoal: num($('#set-steps').value) || 10000, weightGoal: num($('#set-wgoal').value) };
    document.activeElement?.blur();
    await write(db => db.doc('settings/main').set(doc), 'Ajustes guardados');
  }
});

/* ---------- boot ---------- */
async function boot() {
  render();
  const timer = setTimeout(() => { if (!S.ready) { S.slow = true; render(); } }, 10000);
  if (!window.claude?.use) { clearTimeout(timer); S.noDb = true; render(); return; }
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) {}
  if (!db) { clearTimeout(timer); S.noDb = true; render(); return; }
  S.db = db;
  window.claude.use('assets').then(a => { S.assets = a; scheduleRender(); }).catch(() => {});
  const pending = new Set(['programs', 'workouts', 'body', 'steps', 'joints', 'settings', 'plan', 'checkins', 'food', 'foods']);
  db.doc('plan/main').onSnapshot(d => { S.plan = d.exists ? { ...d.data() } : null; got('plan', d); }, e => { pending.delete('plan'); scheduleRender(); });
  const got = (k, snap) => { if (!snap.metadata.fromCache && pending.delete(k) && !pending.size) { S.ready = true; S.slow = false; clearTimeout(timer); } scheduleRender(); };
  const onErr = k => e => { pending.delete(k); if (!pending.size) { S.ready = true; clearTimeout(timer); } if (e?.code === 'revoked' || e?.code === 'not_granted') S.noDb = true; scheduleRender(); };
  const list = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  db.collection('programs').onSnapshot(s => { S.programs = list(s).sort((a,b) => (a.order ?? 0) - (b.order ?? 0)); got('programs', s); }, onErr('programs'));
  db.collection('workouts').onSnapshot(s => { S.workouts = list(s); got('workouts', s); }, onErr('workouts'));
  db.collection('body').onSnapshot(s => { S.body = list(s); got('body', s); }, onErr('body'));
  db.collection('checkins').onSnapshot(s => { S.checkins = list(s); got('checkins', s); }, onErr('checkins'));
  db.collection('steps').onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); S.steps = o; got('steps', s); }, onErr('steps'));
  db.collection('joints').onSnapshot(s => { S.joints = list(s).sort((a,b) => (a.order ?? 0) - (b.order ?? 0)); got('joints', s); }, onErr('joints'));
  db.collection('food').onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); S.food = o; got('food', s); }, onErr('food'));
  db.collection('foods').onSnapshot(s => { S.myFoods = list(s).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)); got('foods', s); }, onErr('foods'));
  db.doc('settings/main').onSnapshot(d => { S.settings = d.exists ? { ...d.data() } : {}; got('settings', d); }, onErr('settings'));
}
window.addEventListener('tg-rerender', scheduleRender);
boot();
})();
</script>
