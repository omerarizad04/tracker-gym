[hidden]{display:none!important}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));overflow:auto}
#auth .authbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}

</head>
<body>
<title>Tracker Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first single column on a black ground with a faint white aura at the top; hairline cards with a soft sheen,
   mono uppercase labels, light oversized numerals; blurred bottom tab bar (Registrar · Rutinas · Progreso · Calendario · Resumen · Performance);
   forms open in a bottom sheet. Black is the default; light only when chosen with the toggle. */
:root{
  --bg:#050505; --surface:#0c0c0d; --surface-2:#161618; --fg:#f2f2ef; --muted:#86868b; --faint:#4b4b50; --line:#1c1c1f; --edge:#2c2c31;
  --accent:#f2f2ef; --accent-soft:#19191c; --on-accent:#050505;
  --ink:#0f0f11; --on-ink:#f2f2ef; --ink-2:#3a3a3f;
  --sand:#cdbb94; --blue:#93a9d8; --green:#8cc7a1; --red:#e3897e;
  --good:#7fd3a0; --warn:#e2c27d; --bad:#f07d72;
  --aura:rgba(255,255,255,.085); --sheen:rgba(255,255,255,.03); --scrim:rgba(0,0,0,.74); --glass:rgba(5,5,5,.72);
  --font-display:"Geist","Inter",system-ui,-apple-system,sans-serif;
  --font-body:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f3f1; --surface:#ffffff; --surface-2:#ebebe8; --fg:#0b0b0c; --muted:#68686d; --faint:#a8a8ac; --line:#e2e2df; --edge:#cdcdca;
  --accent:#0b0b0c; --accent-soft:#e7e7e4; --on-accent:#f7f7f5;
  --ink:#0b0b0c; --on-ink:#f2f2ef; --ink-2:#4a4a4f;
  --sand:#94783d; --blue:#3f63b8; --green:#2f8a57; --red:#c4473a;
  --good:#2f8a57; --warn:#a07410; --bad:#c4473a;
  --aura:rgba(0,0,0,.035); --sheen:rgba(255,255,255,0); --scrim:rgba(10,10,12,.42); --glass:rgba(243,243,241,.8);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body::after{content:"";position:fixed;left:0;right:0;top:0;height:520px;max-height:70vh;z-index:0;pointer-events:none;
  background:radial-gradient(70% 90% at 50% -10%,var(--aura),transparent 72%)}
.wrap{max-width:640px;margin:0 auto;position:relative;z-index:1}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding-block:26px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-inline:-4px;padding-inline:4px}
h1{font-family:var(--font-display);font-weight:500;font-size:32px;letter-spacing:-.05em;line-height:1;margin:0}
.sub{color:var(--muted);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
h2{font-family:var(--font-display);font-weight:500;font-size:21px;letter-spacing:-.035em;margin:0;text-wrap:balance;line-height:1.15}
h3{font-family:var(--font-display);font-weight:500;font-size:16.5px;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.25}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px}
.sec .t{font-family:var(--font-mono);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sec .m{color:var(--faint);font-size:12px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:.12em;text-transform:uppercase}
main{display:flex;flex-direction:column;gap:10px;padding-block:8px 16px}
.card{background:linear-gradient(180deg,var(--sheen),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.soft{background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.02em}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--font-display);font-size:28px;font-weight:300;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.05}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--edge);background:transparent;color:var(--fg);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px;touch-action:manipulation;transition:background-color .15s,border-color .15s,color .15s}
button:hover{border-color:var(--faint)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1.5px solid var(--fg);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
button.ghost{background:transparent;border-color:transparent}
button.danger{color:var(--bad);background:transparent;border-color:var(--line)}
button.sm{min-height:34px;padding:6px 14px;font-size:13px}
button.icon{min-height:40px;min-width:40px;padding:4px 8px;border-color:var(--line)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-width:0;width:100%}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--edge)}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:400;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;background:var(--muted)}
.c-mustard{--pc:var(--sand)} .c-blue{--pc:var(--blue)} .c-green{--pc:var(--green)} .c-red{--pc:var(--red)} .c-ink{--pc:var(--fg)} .c-libre{--pc:var(--faint)}
.dot[class*="c-"]{background:var(--pc)}
.empty{color:var(--muted);text-align:center;padding:24px 14px;border:1px dashed var(--edge);border-radius:var(--r);font-size:14px}
.banner{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
/* routine cards */
.rcard{text-align:left;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r);background:linear-gradient(180deg,var(--sheen),transparent 60%),var(--surface);border:1px solid var(--line);width:100%;font-weight:400}
.rcard:hover{border-color:var(--edge)}
.rcard .nm{font-family:var(--font-display);font-weight:500;font-size:20px;letter-spacing:-.035em;line-height:1.15}
.rcard .ex{color:var(--muted);font-size:13.5px;line-height:1.45}
.rcard.today{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg),0 0 40px -12px var(--aura)}
.rcard.done .nm::after{content:" ✓";color:var(--good)}
.rcard.compact{padding:14px 18px}
.rcard.compact .nm{font-size:16.5px}
.rcard.alt{padding:0;gap:0;overflow:hidden}
.rcard .rmain{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:18px;cursor:pointer;width:100%}
.rcard .rmain:focus-visible{outline:1.5px solid var(--fg);outline-offset:-4px}
.altbar{display:flex;border-top:1px solid var(--line)}
.altbar button{flex:1;border:0;border-radius:0;background:transparent;min-height:44px;font-size:12.5px;font-weight:500;color:var(--muted);padding:6px 4px;min-width:0}
.altbar button+button{border-left:1px solid var(--line)}
.altbar button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.altbar button::before{content:"⇄ ";opacity:0}
.altbar button[aria-pressed="true"]::before{opacity:.8}
/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rest .in2{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.rest-main{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:stretch}
.rest-go{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px;border-radius:16px;min-height:62px}
.rest-go b{font-family:var(--font-display);font-weight:300;font-size:36px;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.rest-go small{font-size:11px;font-weight:400;color:var(--muted)}
.rest.running .rest-go{background:var(--fg);border-color:var(--fg);color:var(--bg)} .rest.running .rest-go small{color:var(--bg);opacity:.7}
.rest.done .rest-go{background:var(--good);border-color:var(--good);color:var(--bg)} .rest.done .rest-go small{color:var(--bg)}
.rest .bar{height:3px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.rest .bar i{display:block;height:100%;background:var(--fg);border-radius:9px;transition:width .25s linear}
.presets{display:flex;gap:6px;align-items:center}
.presets button{flex:1;min-height:32px;padding:4px 6px;font-size:12.5px;border-color:var(--line)}
.presets button[aria-pressed="true"]{border-color:var(--fg)}
@media (prefers-reduced-motion:reduce){.rest .bar i{transition:none}}
/* performance pyramid */
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px}
.pyr .t{border-radius:10px;background:var(--surface-2);color:var(--muted);font-weight:500;font-size:12.5px;display:flex;align-items:center;justify-content:center;min-height:38px;padding:6px;text-align:center;border:1px solid transparent}
.pyr .t.on{background:var(--accent);color:var(--on-accent)}
.pyr .t.done{background:transparent;border-color:var(--edge);color:var(--fg)}
.pyr .mid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pyr .mid .col{display:flex;flex-direction:column;gap:4px}
.pyr .base{flex-direction:column;gap:4px;padding:6px 6px 8px;align-items:center;justify-content:flex-start}
.pyr .base>span{min-height:24px;display:flex;align-items:center}
.pyr .base .t{min-height:34px;width:84%}
.pyr .base .t:last-child{width:92%}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);counter-increment:s}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-top:3px}
.steps b{display:block;font-weight:500}
.steps span{color:var(--muted);font-size:13px}
.blist{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:7px}
.blist li::marker{color:var(--faint)}
.gate{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;font-weight:400;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;text-align:left;width:100%;min-height:0}
.gate:last-child{border-bottom:0}
.gate .bx{flex:none;width:22px;height:22px;border-radius:7px;border:1px solid var(--edge);display:grid;place-items:center;font-size:13px;font-weight:600}
.gate[aria-pressed="true"] .bx{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.gate[aria-pressed="true"] .tx{color:var(--muted);text-decoration:line-through}
.road{display:flex;flex-direction:column}
.road details{border-bottom:1px solid var(--line);padding:12px 0}
.road details:last-child{border-bottom:0}
.road summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none}
.road summary::-webkit-details-marker{display:none}
.road summary b{font-weight:500}
.road .st{flex:none;width:9px;height:9px;border-radius:50%;border:1px solid var(--edge)}
.road .cur .st{background:var(--fg);border-color:var(--fg);box-shadow:0 0 12px var(--fg)}
.road .past .st{background:var(--faint);border-color:var(--faint)}
.road details>div{padding:8px 0 4px 21px;display:flex;flex-direction:column;gap:8px}
.dashed{border:1px dashed var(--edge);background:transparent;border-radius:var(--r);min-height:54px;font-size:14px;font-weight:500;width:100%;color:var(--muted)}
.dashed:hover{color:var(--fg)}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:14px;background:transparent;border:1px solid var(--line);min-width:0}
.wd .l{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.wd .n{font-family:var(--font-display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.wd.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .wd.on .l{color:var(--on-accent);opacity:.6}
.wd.today{border-color:var(--fg)}
.wd .j{width:4px;height:4px;border-radius:50%;background:var(--green)}
.wd.on .j{background:var(--on-accent)}
/* session list */
.sess{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;border-radius:0;width:100%;text-align:left;font-weight:400;min-height:0}
.sess:last-child{border-bottom:0}
.sess .nm{font-weight:500;font-size:15px}
.sess .meta{color:var(--muted);font-size:12.5px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
nav.tabs button{position:relative;border:0;background:transparent;border-radius:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;font-weight:400;color:var(--faint);padding:6px 2px}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;width:18px;height:1.5px;margin-left:-9px;background:var(--fg);box-shadow:0 0 10px var(--fg)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--muted);padding-block:4px}
.cal .d{background:transparent;border:1px solid var(--line);border-radius:10px;min-height:60px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:13px;cursor:pointer;color:var(--fg);font-weight:400;min-width:0}
.cal .d.out{opacity:.3}
.cal .d.today{border-color:var(--fg)}
.cal .d.gym{background:var(--surface-2)}
.cal .d .n{font-family:var(--font-display);font-weight:400;font-size:14px;font-variant-numeric:tabular-nums}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap}
.cal .dots .dot{width:6px;height:6px}
.cal .st{font-family:var(--font-mono);font-size:9.5px;color:var(--good);font-variant-numeric:tabular-nums}
.cal .st.low{color:var(--muted)}
.cal .st.kc{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* hero numbers + rings */
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero .big{font-family:var(--font-display);font-weight:200;font-size:56px;letter-spacing:-.06em;line-height:.95;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;font-weight:400;letter-spacing:-.02em;color:var(--muted)}
.ring{width:104px;height:104px;flex:none}
.ring text{font-family:var(--font-mono);font-weight:400;fill:var(--fg);font-size:15px}
.inkcard{background:linear-gradient(180deg,var(--sheen),transparent 60%),var(--ink);color:var(--on-ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.inkcard .label{color:var(--on-ink);opacity:.6}
.inkcard .big{font-family:var(--font-display);font-weight:300;font-size:38px;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid currentColor;font-variant-numeric:tabular-nums;opacity:.85}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat i{aspect-ratio:1;border-radius:6px;display:block;background:var(--surface-2);max-width:100%;position:relative}
.heat i.l1{background:color-mix(in srgb,var(--fg) 18%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--fg) 40%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--fg) 68%,var(--surface-2))}
.heat i.l4{background:var(--fg)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.heat i.pad{visibility:hidden}
.heat i.tdy{outline:1.5px solid var(--fg);outline-offset:1px}
.scale{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.scale i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--edge);max-height:94dvh;overflow:auto;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#sheet .head{position:sticky;top:0;background:var(--bg);padding-block:18px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2;border-bottom:1px solid var(--line)}
.timer{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
/* logger */
.exl{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.exl .meta{font-size:12.5px;color:var(--muted)}
.exl .meta b{color:var(--fg);font-weight:500}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 44px 34px;gap:6px;align-items:center}
.set .i{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-align:center}
.set input{text-align:center;padding:9px 4px}
.colh{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.ok{width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--faint);min-height:0;padding:0}
.ok[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.blocktag{font-family:var(--font-mono);font-weight:400;letter-spacing:.16em;text-transform:uppercase;font-size:10.5px;padding:4px 0;align-self:flex-start;margin-top:8px;color:var(--muted)}
.blocktag::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;background:var(--faint);vertical-align:1px}
.blocktag.HIPERTROFIA::before{background:var(--red)} .blocktag.CORE::before{background:var(--blue)} .blocktag.POTENCIA::before{background:var(--sand)} .blocktag.MOVILIDAD::before{background:var(--green)}
/* editor */
.edrow{display:grid;grid-template-columns:minmax(0,2.2fr) 54px 64px 70px 34px;gap:6px;align-items:center}
.edrow input{padding:8px 6px;font-size:15px}
.edhead{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dayed{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.blked{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:9px}
.chart .gl{stroke:var(--line);stroke-width:1}
.hist{display:flex;flex-direction:column}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist .h:last-child{border-bottom:0}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;min-height:36px;font-size:13.5px;padding:6px 10px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--surface-2);max-width:100%}
.photos figcaption{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center}
/* revisión cuatrimestral */
.seg.four button{flex:1 1 auto;font-size:12.5px;padding:6px 6px;white-space:nowrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.cmp img,.cmp .ph{width:100%;max-width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:0}
.cmp figcaption{font-size:12px;text-align:center;color:var(--muted)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(96px,30%);gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.strip figure{margin:0;display:flex;flex-direction:column;gap:3px;scroll-snap-align:start}
.strip img,.strip .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--surface-2)}
.strip figcaption{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center}
.gtab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}

.gtab th:first-child,.gtab td:first-child{text-align:left}
.gtab td{padding:8px 3px;border-top:1px solid var(--line);text-align:right;font-size:13px;white-space:nowrap}
.gtab td:first-child{white-space:normal}
.gtab td.up{color:var(--good);font-weight:500}.gtab td.down{color:var(--bad);font-weight:500}
.gin{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px;gap:6px;align-items:center}
.gin input{text-align:center;padding:8px 4px}
.gin .nm{font-size:14px}
.posein{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
.posein img,.posein .ph{width:72px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center}
.due{border-color:var(--fg)!important}
.warn{color:var(--warn);font-size:13px;margin:0}
#pc-list .gate[aria-pressed="true"] .tx{text-decoration:none;color:var(--fg)}
.pain{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 7px;border-radius:999px;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:13.5px;max-width:90vw;box-shadow:0 10px 40px -10px var(--aura)}
/* nutrition */
.datebar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px}
.datebar .d{text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.datebar .d b{display:block;font-family:var(--font-display);font-size:15px;letter-spacing:-.01em;text-transform:none;color:var(--fg);font-weight:500;margin-top:2px}
.mbars{display:flex;flex-direction:column;gap:12px}
.mbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:baseline}
.mbar .n{font-size:13.5px}
.mbar .v{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mbar .v b{color:var(--fg);font-weight:400}
.mbar .tr{grid-column:1/-1;height:3px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mbar .tr i{display:block;height:100%;background:var(--fg);border-radius:3px}
.mbar .tr i.over{background:var(--warn)}
.mbar .tr i.low{background:var(--faint)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .v{font-family:var(--font-display);font-weight:300;font-size:22px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.mini .v small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{flex:1;min-height:36px;font-size:13px;padding:6px 10px}
.insight{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);line-height:1.45}
.insight::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--fg);margin-top:7px;box-shadow:0 0 8px var(--fg)}
.insight b{color:var(--fg);font-weight:500}
.meal{display:flex;flex-direction:column}
.meal .mh{display:flex;align-items:center;gap:10px;padding-block:4px 10px}
.meal .mh .nm{font-family:var(--font-display);font-weight:500;font-size:16.5px;letter-spacing:-.02em}
.meal .mh .kc{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0;width:100%;text-align:left;font-weight:400;min-height:0}
.fi .nm{font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .q{grid-column:1;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fi .k{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.meal .add{align-self:flex-start;margin-top:8px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;border-radius:0;width:100%;text-align:left;font-weight:400;min-height:0}
.frow .nm{font-size:14.5px;min-width:0}
.frow .mt{grid-column:1;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.frow .pl{grid-row:1/3;grid-column:2;width:30px;height:30px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;color:var(--muted);font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:32px;padding:4px 12px;font-size:12.5px;border-color:var(--line);color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nutgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.nutgrid div{border:1px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;gap:1px;min-width:0}
.nutgrid b{font-family:var(--font-display);font-weight:400;font-size:18px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nutgrid span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qty{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.qty input{text-align:center;font-family:var(--font-display);font-size:24px;font-weight:300;letter-spacing:-.03em;padding:8px}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv span:last-child{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.kv .hl span{color:var(--fg)} .kv .hl span:first-child{font-weight:500}
.wbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:110px}
.wbars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.wbars .b i{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--faint)}
.wbars .b i.ok{background:var(--fg)}
.wbars .b i.none{background:transparent;border:1px dashed var(--line);height:6px!important}
.wbars .b span{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.wbars .b.tdy span{color:var(--fg)}
.wwrap{position:relative}
.wwrap .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);opacity:.6}
details.more summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-family:var(--font-mono);color:var(--muted);font-size:16px}
details.more[open] summary::after{content:"−"}
.refs{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.refs b{color:var(--fg);font-weight:500}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.opt button{min-height:40px;font-size:13px;padding:6px 8px;border-color:var(--line);color:var(--muted);border-radius:12px;line-height:1.2}
.opt button small{display:block;font-family:var(--font-mono);font-size:10px;opacity:.75;margin-top:2px}
.opt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.npyr{display:flex;flex-direction:column;align-items:center;gap:4px}
.npyr div{background:var(--surface-2);border-radius:9px;min-height:30px;display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:4px}
.npyr div:last-child{background:var(--accent);color:var(--on-accent)}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.5}}}
@media (max-width:420px){.edrow{grid-template-columns:minmax(0,1fr) 46px 56px 60px 30px}h1{font-size:28px}.hero .big{font-size:46px}.ring{width:88px;height:88px}.nutgrid b{font-size:16px}}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const DOW = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DOWS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DL = ['D','L','M','X','J','V','S'];
const MON = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtD = s => { const d = pd(s); return `${DOWS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`; };
const fmtShort = s => { const d = pd(s); return `${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`; };
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const fmtN = (n, d = 1) => n == null || !Number.isFinite(n) ? '–' : (Math.round(n * 10**d) / 10**d).toLocaleString('es-ES');
const fmtI = n => n == null ? '–' : Math.round(n).toLocaleString('es-ES');
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => ymd(new Date());
const COLORS = { mustard: 'Mostaza', blue: 'Azul', green: 'Verde', red: 'Rojo', ink: 'Negro' };
const TITLES = { reg: 'Registrar', rut: 'Rutinas', prog: 'Progreso', cal: 'Calendario', res: 'Resumen', perf: 'Performance' };
const TIERS = { mobility: 'Movilidad', stability: 'Estabilidad', movement: 'Movimiento', strength: 'Fuerza', power: 'Potencia', endurance: 'Resistencia', skill: 'Habilidad' };

const S = {
  db: null, assets: null, ready: false, slow: false, noDb: false,
  programs: [], workouts: [], body: [], steps: {}, joints: [], settings: {},
  tab: 'reg', calMonth: (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(),
  progEx: null, progSeg: 'fuerza', bodyMetric: 'weight',
  checkins: [], ciPose: 'front', ciA: null, ciB: null, ciM: 'armR',
  food: {}, myFoods: [], regSeg: 'gym', nutDate: null, nutMicros: false
};
try { if (localStorage.getItem('tg-regseg') === 'nut') S.regSeg = 'nut'; } catch (e) {}
try { const t = localStorage.getItem('tg-tab'); if (TITLES[t]) S.tab = t; } catch (e) {}
try { const th = localStorage.getItem('tg-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}

/* ---------- data helpers ---------- */
const prog = id => S.programs.find(p => p.id === id);
const pcolor = id => id === 'libre' ? 'libre' : (prog(id)?.color || 'ink');
const isJoint = w => prog(w.programId)?.kind === 'joints';
const activeProg = () => prog(S.settings.activeProgram) || S.programs.find(p => p.kind !== 'joints') || null;
const stepsOn = date => { const m = S.steps[date.slice(0,7)]; return m?.days?.[date.slice(8)] ?? null; };
const stepGoal = () => S.settings.stepGoal || 10000;
const strideM = () => ((S.settings.heightCm || 175) * 0.415) / 100;
const kmOf = steps => steps * strideM() / 1000;
const bodyOn = date => S.body.find(b => b.date === date);
const lastBody = (f = 'weight') => [...S.body].filter(b => b[f] != null).sort((a,b) => b.date.localeCompare(a.date))[0];
const bmi = w => { const h = S.settings.heightCm; return (w && h) ? w / ((h/100)**2) : null; };
const bmiCat = v => v == null ? '' : v < 18.5 ? 'Bajo peso' : v < 25 ? 'Normal' : v < 30 ? 'Sobrepeso' : 'Obesidad';
const painColor = p => p == null ? 'var(--muted)' : p <= 2 ? 'var(--good)' : p <= 5 ? 'var(--warn)' : 'var(--bad)';
const exTarget = ex => {
  const parts = [];
  if (ex.sets) parts.push(`${ex.sets}×${ex.reps || '?'}`); else if (ex.reps) parts.push(ex.reps);
  if (ex.weight != null && ex.weight !== '') parts.push(`${fmtN(ex.weight)} kg`);
  return parts.join(' · ');
};
// Second column of each set depends on the exercise: kg, lastre, treadmill incline, bike level, band, box height, or nothing.

function niceStep(range, n) { const raw = range / n || 1, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

  if (goal != null) s += `<line x1="${L}" x2="${W-R}" y1="${sy(goal)}" y2="${sy(goal)}" stroke="var(--green)" stroke-dasharray="4 3"/><text x="${L+4}" y="${sy(goal)-4}" style="fill:var(--green)">meta ${fmtN(goal)}</text>`;
  if (extra) s += `<path d="${extra.map((p,i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join('')}" fill="none" stroke="var(--blue)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  const line = pts.map((p,i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join('');
  if (pts.length > 1) s += `<path d="${line}L${sx(pts[pts.length-1].x).toFixed(1)} ${H-B}L${sx(pts[0].x).toFixed(1)} ${H-B}Z" fill="${color}" opacity=".1"/>`;
  s += `<path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/>`;
  pts.forEach((p,i) => { const last = i === pts.length - 1; s += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${last ? 4.5 : 2.6}" fill="${last ? color : 'var(--surface)'}" stroke="${color}" stroke-width="1.6"/>`; });
  const lp = pts[pts.length-1];
  s += `<text x="${Math.min(sx(lp.x), W-R)}" y="${sy(lp.y)-9}" text-anchor="end" style="fill:var(--fg);font-weight:700;font-size:11px">${lab(lp.y)} ${esc(unit)}</text>`;
  return s + '</svg>';
}

/* ---------- Calendario ---------- */
function vCal() {
  const m = S.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const start = mondayOf(new Date(y, mo, 1));
  const t = today(), g = stepGoal();
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== mo) break;
    const k = ymd(d), ws = S.workouts.filter(w => w.date === k), st = stepsOn(k), b = bodyOn(k);
    cells += `<button class="d${d.getMonth() !== mo ? ' out' : ''}${k === t ? ' today' : ''}${ws.some(w => !isJoint(w)) ? ' gym' : ''}" data-act="day" data-date="${k}" aria-label="${fmtD(k)}">
      <span class="n">${d.getDate()}</span><span class="dots">${ws.map(w => `<i class="dot c-${esc(pcolor(w.programId))}"></i>`).join('')}${b ? '<i class="dot c-ink"></i>' : ''}</span>
      ${st != null ? `<span class="st${st < g ? ' low' : ''}">${st >= 1000 ? fmtN(st/1000) + 'k' : st}</span>` : ''}</button>`;
  }
  const monthWs = S.workouts.filter(w => w.date.startsWith(`${y}-${pad(mo+1)}`)).sort((a,b) => b.date.localeCompare(a.date));
  return `<section class="card soft">
    <div class="row between"><button class="icon" data-act="mon" data-v="-1" aria-label="Mes anterior">‹</button><h2 style="text-transform:capitalize">${MON[mo]} ${y}</h2><button class="icon" data-act="mon" data-v="1" aria-label="Mes siguiente">›</button></div>
    <div class="cal">${['L','M','X','J','V','S','D'].map(x => `<div class="dh">${x}</div>`).join('')}${cells}</div>
    <div class="legend">${S.programs.map(p => `<span><i class="dot c-${esc(p.color)}"></i>${esc(p.name)}</span>`).join('')}<span><i class="dot c-libre"></i>Libre</span><span><i class="dot c-ink"></i>Medidas</span><span><b style="color:var(--good)">10k</b> pasos en meta</span></div>
    <p class="muted small" style="margin:0">Toca un día para registrar entreno, pasos o medidas, también de días pasados.</p></section>
  <div class="sec"><span class="t">Sesiones del mes</span><span class="m">${monthWs.filter(w => !isJoint(w)).length} entrenos · ${monthWs.filter(isJoint).length} articulaciones</span></div>
  ${monthWs.length ? `<div class="card soft" style="padding-block:4px">${monthWs.map(w => `<button class="sess" data-act="log" data-w="${esc(w.id)}" data-date="${w.date}"><span><i class="dot c-${esc(pcolor(w.programId))}"></i> <b>${esc(w.dayName)}</b></span><span class="meta">${fmtD(w.date)}</span></button>`).join('')}</div>` : '<div class="empty">Sin sesiones este mes.</div>'}`;
}

/* ---------- Resumen ---------- */
function ring(pct) {
  const r = 44, c = 2 * Math.PI * r, p = Math.min(1, pct);
  return `<svg class="ring" viewBox="0 0 108 108" role="img" aria-label="${Math.round(pct*100)}% de la meta"><circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="3"/><circle cx="54" cy="54" r="${r}" fill="none" stroke="${pct >= 1 ? 'var(--good)' : 'var(--fg)'}" stroke-width="3" stroke-linecap="${p > 0 ? 'round' : 'butt'}" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 54 54)"/><text x="54" y="62" text-anchor="middle">${Math.round(pct*100)}%</text></svg>`;
}
function vRes() {
  const t = today(), g = stepGoal(), st = stepsOn(t);
  const left = Math.max(0, g - (st || 0));
  let html = `<section class="card"><span class="label">Pasos hoy</span>
    <div class="hero"><div><div class="big">${st != null ? fmtI(st) : '—'}</div><div class="muted small" style="margin-top:6px">${st == null ? `Meta ${fmtI(g)} pasos` : left > 0 ? `Te faltan ${fmtI(left)} · ${fmtN(kmOf(st))} km` : `Meta cumplida · ${fmtN(kmOf(st))} km`}</div></div>${ring((st || 0) / g)}</div>
    <form class="row" data-form="steps" data-date="${t}"><input id="steps-today" class="grow" type="number" inputmode="numeric" min="0" placeholder="Pasos de hoy (míralos en Salud)" value="${st ?? ''}"><button class="dark" type="submit">Guardar</button></form></section>`;
  // weekly average vs last week (logged days only)
  const wk = weekDates(new Date()), prevBase = new Date(); prevBase.setDate(prevBase.getDate() - 7);
  const pw = weekDates(prevBase);
  const avg = arr => { const v = arr.map(stepsOn).filter(x => x != null); return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null; };
  const a1 = avg(wk.filter(d => d <= t)), a0 = avg(pw);
  const ch = a1 != null && a0 ? Math.round((a1 / a0 - 1) * 100) : null;
  const vals = wk.map(d => stepsOn(d) || 0), mx = Math.max(g, ...vals);
  const BW = 30, GAP = (300 - BW*7) / 6;
  html += `<section class="inkcard"><div class="row between"><span class="label">Media semanal</span>${ch != null ? `<span class="pill">${ch >= 0 ? '↑' : '↓'} ${Math.abs(ch)} %</span>` : ''}</div>
    <div class="big">${a1 != null ? fmtI(a1) : '—'}</div>
    <svg class="chart" viewBox="0 0 300 96" role="img" aria-label="Pasos por día de esta semana">${wk.map((d, i) => { const v = vals[i], h = v ? Math.max(3, v / mx * 78) : 0, x = i * (BW + GAP);
      return `<rect x="${x}" y="0" width="${BW}" height="78" rx="6" fill="currentColor" opacity=".08"/>${v ? `<rect x="${x}" y="${78-h}" width="${BW}" height="${h}" rx="6" fill="currentColor" opacity="${d === t ? 1 : v >= g ? .75 : .4}"/>` : ''}<text x="${x+BW/2}" y="93" text-anchor="middle" style="fill:currentColor;opacity:.7">${DL[pd(d).getDay()]}</text>`; }).join('')}
      <line x1="0" x2="300" y1="${78 - g/mx*78}" y2="${78 - g/mx*78}" stroke="currentColor" stroke-dasharray="3 3" opacity=".5"/></svg></section>`;
  // monthly heatmap
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth(), dim = new Date(y, mo + 1, 0).getDate();
  const lead = (new Date(y, mo, 1).getDay() + 6) % 7;
  let cells = Array.from({ length: lead }, () => '<i class="pad"></i>').join('');
  let met = 0, logged = 0;
  for (let d = 1; d <= dim; d++) {
    const k = `${y}-${pad(mo+1)}-${pad(d)}`, v = stepsOn(k);
    if (v != null) { logged++; if (v >= g) met++; }
    const lv = k > t ? 'fut' : v == null ? '' : v >= g ? 'l4' : v >= g*.75 ? 'l3' : v >= g*.5 ? 'l2' : 'l1';
    cells += `<i class="${lv}${k === t ? ' tdy' : ''}" title="${d} ${MON[mo]}: ${v != null ? fmtI(v) + ' pasos' : 'sin dato'}"></i>`;
  }
  html += `<section class="card soft"><div class="row between"><h3>Historial · ${MON[mo]}</h3><span class="scale">Menos <i style="background:var(--surface-2)"></i><i style="background:color-mix(in srgb,var(--fg) 22%,var(--surface-2))"></i><i style="background:color-mix(in srgb,var(--fg) 48%,var(--surface-2))"></i><i style="background:color-mix(in srgb,var(--fg) 72%,var(--surface-2))"></i><i style="background:var(--fg)"></i> Más</span></div>
    <div class="heat">${cells}</div>
    <div class="row between"><span class="label">Objetivo cumplido</span><span class="num" style="font-size:20px">${met} de ${logged} días</span></div></section>`;
  // body
  const lb = lastBody('weight'), bm = lb ? bmi(lb.weight) : null;
  const mWs = S.workouts.filter(w => w.date.startsWith(`${y}-${pad(mo+1)}`));
  html += `<div class="sec"><span class="t">Cuerpo y entrenos</span><button class="sm" data-act="body" data-date="${t}">+ Medición</button></div>
    <div class="tiles"><div class="tile"><span class="label">Peso</span><span class="v">${lb ? fmtN(lb.weight) : '—'} <small>kg</small></span><span class="small muted">${lb ? fmtShort(lb.date) : 'sin datos'}</span></div>
    <div class="tile"><span class="label">IMC</span><span class="v">${bm ? fmtN(bm) : '—'}</span><span class="small muted">${bm ? bmiCat(bm) : 'Falta altura'}</span></div>
    <div class="tile"><span class="label">Entrenos del mes</span><span class="v">${mWs.filter(w => !isJoint(w)).length}</span><span class="small muted">${mWs.filter(isJoint).length} de articulaciones</span></div>
    <div class="tile"><span class="label">Volumen del mes</span><span class="v">${fmtN(mWs.reduce((a,w) => a + volume(w), 0) / 1000)} <small>t</small></span><span class="small muted">reps × kg</span></div></div>`;
  return html;
}

/* ---------- Performance (Gray Cook's performance pyramid, phase by phase) ---------- */
const SESSION_ORDER = [
  ['Calentamiento y movilidad', 'CARs de tobillo, cadera, rodilla y codo-muñeca, 8-10 minutos.'],
  ['Velocidad', 'Sprint, pliometría, lanzamientos. Sistema nervioso fresco y máxima calidad técnica.'],
  ['Potencia', 'Olímpicos, balísticos, saltos con carga. Fuerza + velocidad, intención explosiva.'],
  ['Fuerza máxima', 'Alta carga, pocas reps, mucha demanda neural. Intensidad antes que volumen.'],
  ['Hipertrofia', 'Más volumen, más fatiga muscular, tensión sostenida.'],
  ['Core y estabilidad', 'Anti-extensión, anti-rotación, carries.'],
  ['Resistencia', 'De mayor a menor intensidad: HIIT o sprints repetidos → intervalos largos → zona 2.']
];
function pyramid(on, done) {
  const t = (k, st = '') => `<div class="t${on.includes(k) ? ' on' : done.includes(k) ? ' done' : ''}"${st ? ` style="${st}"` : ''}>${TIERS[k]}</div>`;
  const base = on.includes('movement') ? ' on' : done.includes('movement') ? ' done' : '';
  return `<div class="pyr" role="img" aria-label="Pirámide de rendimiento: en foco ${on.map(k => TIERS[k]).join(', ')}">
    <div style="width:56%">${t('skill')}</div>
    <div class="mid" style="width:78%"><div class="col">${t('power')}${t('strength')}</div>${t('endurance', 'height:100%')}</div>
    <div class="t base${base}" style="width:100%"><span>Movimiento</span>${t('stability')}${t('mobility')}</div></div>`;
}
function vPerf() {
  const P = S.plan;
  if (!P?.phases?.length) return `<div class="empty">Tu plan de desarrollo aparecerá aquí.</div>`;
  const ph = P.phases, ci = Math.max(0, ph.findIndex(x => x.id === P.currentPhase)), cur = ph[ci];
  const days = Math.floor((pd(today()) - pd(P.phaseStart || today())) / 864e5);
  const wk = Math.max(1, Math.floor(days / 7) + 1);
  const done = [...new Set(ph.slice(0, ci).flatMap(x => x.tiers || []))].filter(k => !(cur.tiers || []).includes(k));
  const checks = P.checks || {};
  const gates = cur.gates || [], passed = gates.filter(g => checks[g.id]).length;
  const pct = cur.weeks ? Math.min(100, Math.round(wk / cur.weeks * 100)) : 100;
  let html = `<section class="card">
    <div class="row between"><span class="label">Fase ${ci} de ${ph.length - 1} · ${cur.weeks ? `semana ${wk} de ${cur.weeks}` : 'continua'}</span>${(cur.tiers||[]).length < 7 ? (cur.tiers||[]).map(k => `<span class="chip acc">${TIERS[k]}</span>`).join('') : '<span class="chip acc">Todo</span>'}</div>
    <h2>${esc(cur.name)}</h2><p class="muted" style="margin:0">${esc(cur.goal)}</p>
    ${cur.weeks ? `<div class="bar" style="height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:var(--accent)"></i></div>` : ''}
    ${cur.weeks && wk > cur.weeks ? `<p class="small" style="margin:0;color:var(--warn)">Ya pasaste las semanas previstas. Avanzas cuando cumplas los criterios, no por calendario.</p>` : ''}
  </section>
  <section class="card soft"><div class="row between"><h3>Pirámide de rendimiento</h3><span class="label">de abajo hacia arriba</span></div>
    ${pyramid(cur.tiers || [], done)}
    <div class="legend"><span><i class="dot" style="background:var(--fg)"></i>En foco ahora</span><span><i class="dot" style="background:transparent;border:1px solid var(--edge)"></i>Ya trabajado</span></div>
    <p class="small muted" style="margin:0">Cada nivel se apoya en el de abajo. Si la base (movilidad y estabilidad) es pequeña, la fuerza y la potencia que pongas encima acaban en lesión.</p></section>
  <section class="card soft"><h3>Cómo entrenar en esta fase</h3><ul class="blist">${(cur.training||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    ${(cur.avoid||[]).length ? `<span class="label" style="margin-top:4px">Evitar</span><ul class="blist">${cur.avoid.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</section>`;
  if (gates.length) html += `<section class="card"><div class="row between"><h3>Criterios para avanzar</h3><span class="chip">${passed} / ${gates.length}</span></div>
    <p class="small muted" style="margin:0">Pasas de fase cuando los cumples, no cuando se acaba el calendario. Mídelos en Progreso › Articulaciones.</p>
    <div>${gates.map(g => `<button class="gate" data-act="gate" data-g="${esc(g.id)}" aria-pressed="${!!checks[g.id]}"><span class="bx">${checks[g.id] ? '✓' : ''}</span><span class="tx">${esc(g.text)}${checks[g.id] ? ` <span class="small muted">· ${fmtShort(checks[g.id])}</span>` : ''}</span></button>`).join('')}</div>
    ${ci < ph.length - 1 ? `<button class="${passed === gates.length ? 'primary' : ''}" data-act="advance" data-armed="${passed === gates.length ? '1' : ''}">${passed === gates.length ? `Empezar fase ${ci + 1}: ${esc(ph[ci+1].name)}` : 'Avanzar sin cumplir todo'}</button>` : ''}</section>`;
  html += `<section class="card soft"><h3>Orden dentro de cada sesión</h3><ol class="steps">${SESSION_ORDER.map(([a,b]) => `<li><div><b>${a}</b><span>${b}</span></div></li>`).join('')}</ol>
    <p class="small muted" style="margin:0">Lo rápido y técnico va primero, con el sistema nervioso fresco. Lo que más cansa va al final.</p></section>`;
  // roadmap with estimated dates
  let est = pd(P.phaseStart || today());
  const road = ph.map((x, i) => {
    let when = '';
    if (i < ci) when = 'Completada';
    else if (i === ci) { when = `Desde ${fmtShort(P.phaseStart)}`; est = new Date(est); est.setDate(est.getDate() + Math.max(cur.weeks, wk) * 7); }
    else { when = `≈ ${fmtShort(ymd(est))}${x.weeks ? ` · ${x.weeks} sem` : ''}`; est = new Date(est); est.setDate(est.getDate() + x.weeks * 7); }
    return `<details class="${i < ci ? 'past' : i === ci ? 'cur' : ''}"${i === ci ? ' open' : ''}><summary><span class="st"></span><span class="grow"><b>${i}. ${esc(x.name)}</b><br><span class="small muted">${when}</span></span><span class="small muted">${(x.tiers||[]).length < 7 ? (x.tiers||[]).map(k => TIERS[k]).join(' · ') : 'Toda la pirámide'}</span></summary>
      <div><span class="small">${esc(x.goal)}</span>${(x.gates||[]).length ? `<span class="small muted">Para salir: ${x.gates.map(g => esc(g.text)).join(' · ')}</span>` : ''}${i !== ci ? `<button class="sm" data-act="gophase" data-i="${i}" style="align-self:flex-start">Poner esta fase como actual</button>` : ''}</div></details>`;
  }).join('');
  html += `<section class="card soft"><h3>Hoja de ruta</h3><div class="road">${road}</div></section>
    <p class="small muted" style="margin:0 4px">Plan orientativo basado en la pirámide de rendimiento de Gray Cook. No sustituye la valoración de un fisioterapeuta, sobre todo con el codo y los tobillos.</p>`;
  return html;
}
async function savePlan(patch, msg) {
  const np = { ...clone(S.plan), ...patch };
  S.plan = np; render();
  await write(db => db.doc('plan/main').set(body(np)), msg);
}

const scaleN = (n, g) => { const o = {}; NK.forEach(k => o[k] = (Number(n?.[k]) || 0) * g / 100); return o; };
const sumItems = items => { const t = {}; NK.forEach(k => t[k] = 0); (items || []).forEach(it => { const s = scaleN(it.n, it.g); NK.forEach(k => t[k] += s[k]); }); return t; };
const allFoods = () => [...S.myFoods.map(f => ({ ...f, cat: 'mine', portions: f.portions || [] })), ...FOODS];
const dayShift = (d, n) => { const x = pd(d); x.setDate(x.getDate() + n); return ymd(x); };
function recentFoods() {
  const seen = new Map();
  Object.keys(S.food).sort().reverse().slice(0, 21).forEach(d => (S.food[d].items || []).forEach(it => {
    const k = it.fid || norm(it.name); const o = seen.get(k);
    if (o) o.c++; else seen.set(k, { c: 1, f: { id: it.fid || k, name: it.name, cat: it.cat || 'rec', n: it.n, portions: it.portions || [], lastG: it.g } });
  }));
  return [...seen.values()].sort((a, b) => b.c - a.c).slice(0, 30).map(x => x.f);
}

/* objetivos: Mifflin-St Jeor (o Katch-McArdle con % grasa) + actividad desglosada en base, pasos y entreno */
const JOBS = { sit: ['Sentado', 1.2, 'oficina, estudio'], mix: ['Mixto', 1.3, 'de pie a ratos'], act: ['Activo', 1.4, 'de pie o físico'] };
const GOALS = { lose: 'Perder grasa', keep: 'Mantener / recomposición', gain: 'Ganar músculo' };
const RATES = { lose: [[0.5, 'Suave', '0,5 %/sem'], [0.75, 'Recomendado', '0,75 %/sem'], [1, 'Rápido', '1 %/sem']], gain: [[0.25, 'Limpio', '0,25 %/sem'], [0.5, 'Rápido', '0,5 %/sem']], keep: [[0, 'Mantener', '±0']] };
function calcTargets(i) {
  const w = i.weight, h = i.height, a = i.age;
  const mif = 10 * w + 6.25 * h - 5 * a + (i.sex === 'f' ? -161 : 5);
  const lbm = i.bf ? w * (1 - i.bf / 100) : null;
  const bmr = lbm ? 370 + 21.6 * lbm : mif;
  const base = bmr * (JOBS[i.job] || JOBS.sit)[1];
  const stepsRec = i.goal === 'lose' ? Math.max(i.steps || 0, i.rate >= 0.75 ? 12000 : 10000) : Math.max(i.steps || 0, 8000);
  const stride = h * 0.415 / 100;
  const stepsK = Math.max(0, stepsRec - 3000) * stride / 1000 * 0.5 * w;          // ≈0,5 kcal/kg/km neto caminando
  const liftK = (i.liftMin || 0) / 7 * 3.5 * 3.5 * w / 200;                         // pesas ≈ 4,5 MET (neto 3,5)
  const cardioK = (i.cardioMin || 0) / 7 * 6 * 3.5 * w / 200;                       // fútbol / HIIT ≈ 7 MET (neto 6)
  const tdee = base + stepsK + liftK + cardioK;
  const sign = i.goal === 'lose' ? -1 : i.goal === 'gain' ? 1 : 0;
  const wk = sign * (i.rate || 0) / 100 * w;                                         // kg por semana
  let kcal = tdee + wk * 7700 / 7;
  const floor = Math.max(bmr, i.sex === 'f' ? 1200 : 1500);
  const floored = kcal < floor; if (floored) kcal = floor;
  kcal = Math.round(kcal / 10) * 10;
  const bmiV = w / ((h / 100) ** 2), refW = bmiV > 30 ? 25 * (h / 100) ** 2 : w;
  const p = Math.round((i.pkg || 1.8) * refW);
  let f = Math.round(0.8 * refW); if (f * 9 < 0.2 * kcal) f = Math.round(0.2 * kcal / 9);
  const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  const fib = Math.round(14 * kcal / 1000);
  const water = Math.round((0.035 * w + ((i.liftMin || 0) + (i.cardioMin || 0)) / 7 / 60 * 0.5) * 10) / 10;
  const dW = i.target ? i.target - w : 0;
  const weeks = wk && dW && Math.sign(dW) === Math.sign(wk) ? Math.ceil(Math.abs(dW / wk)) : null;
  return { bmr: Math.round(bmr), mif: Math.round(mif), lbm, base: Math.round(base), stepsK: Math.round(stepsK), liftK: Math.round(liftK), cardioK: Math.round(cardioK), tdee: Math.round(tdee),
    wk, kcal, p, f, c, fib, water, steps: stepsRec, weeks, floored, refW, perMeal: Math.round(0.4 * refW), cLow: c < 3 * w && (i.liftMin + i.cardioMin) >= 240, dirMismatch: !!(dW && sign && Math.sign(dW) !== sign) };
}
// tendencia de peso (kg/semana) con regresión lineal de las pesadas de las últimas 4 semanas
function weightTrend() {
  const from = dayShift(today(), -28);
  const pts = S.body.filter(b => b.weight != null && b.date >= from).sort((a, b) => a.date.localeCompare(b.date));
  if (pts.length < 4) return null;
  const xs = pts.map(b => (pd(b.date) - pd(pts[0].date)) / 864e5), ys = pts.map(b => b.weight);
  if (xs[xs.length - 1] < 10) return null;
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  const sl = xs.reduce((a, x, k) => a + (x - mx) * (ys[k] - my), 0) / xs.reduce((a, x) => a + (x - mx) ** 2, 0);
  return { perWeek: sl * 7, n: pts.length, days: Math.round(xs[xs.length - 1]) };
}
function trendAdvice(N) {
  const tr = weightTrend(); if (!tr || !N?.t) return null;
  const exp = N.t.wk || 0, diff = tr.perWeek - exp;
  const adj = Math.max(-300, Math.min(300, Math.round(-diff * 1100 / 50) * 50));
  return { ...tr, exp, adj };
}

function nutBar(name, v, t, unit, kind = 'min', dec = 0) {
  const pct = t ? v / t : 0, over = kind === 'max' ? pct > 1 : kind === 'macro' ? pct > 1.1 : false;
  const f = x => dec ? fmtN(x, dec) : fmtI(x);
  return `<div class="mbar"><span class="n">${name}</span><span class="v"><b>${f(v)}</b>${t ? ` / ${f(t)}` : ''} ${unit}</span><span class="tr"><i class="${over ? 'over' : pct < 0.5 && kind !== 'max' ? 'low' : ''}" style="width:${Math.min(100, pct * 100).toFixed(1)}%"></i></span></div>`;
}
function nutInsights(d, tot, day, T, N) {
  const out = [], isToday = d === today(), hr = new Date().getHours(), items = day.items || [];
  if (!T || !items.length) return out;
  const pRem = T.p - tot.p;
  if (pRem >= 20 && (isToday || d < today())) out.push(`Te faltan <b>${fmtI(pRem)} g de proteína</b>: ≈ ${fmtI(Math.round(pRem / 0.31 / 10) * 10)} g de pechuga de pollo, ${fmtN(pRem / 23.4, 1)} cacitos de whey o ${fmtI(Math.round(pRem / 0.102 / 50) * 50)} g de yogur griego 0 %.`);
  const kRem = T.kcal - tot.kcal;
  if (kRem < -0.1 * T.kcal) out.push(`Vas <b>${fmtI(-kRem)} kcal</b> por encima del objetivo.${N?.inp?.goal === 'lose' ? ' Un día no cambia nada; mira la media de la semana.' : ''}`);
  else if (isToday && hr >= 20 && kRem > 0.2 * T.kcal && N?.inp?.goal === 'gain') out.push(`Te quedan <b>${fmtI(kRem)} kcal</b>. Para ganar músculo hay que cerrar el día cerca del objetivo: un vaso de leche con avena y crema de cacahuete son ≈ 600 kcal.`);
  const meals = MEALS.map(([k]) => items.filter(i => i.m === k)).filter(a => a.length);
  if (meals.length >= 3 && tot.fib < 0.6 * T.fib) out.push(`Fibra baja (<b>${fmtI(tot.fib)} de ${T.fib} g</b>). Suma legumbres, fruta entera, verdura o avena.`);
  if (tot.na > 2300) out.push(`Sodio alto: <b>${fmtI(tot.na)} mg</b> (límite 2.300 mg ≈ 5,8 g de sal). Embutidos, pan y salsas suelen ser la causa.`);
  const perMeal = Math.max(20, Math.round(0.3 * (N?.t?.refW || 75)));
  const good = meals.filter(a => a.reduce((s, it) => s + (Number(it.n?.p) || 0) * it.g / 100, 0) >= perMeal).length;
  if (meals.length >= 3 && good < 3) out.push(`Solo ${good} comida${good === 1 ? '' : 's'} con ≥ ${perMeal} g de proteína. Repartirla en 3-5 tomas de ≈ ${N?.t?.perMeal || 30} g aprovecha mejor la síntesis muscular.`);
  return out.slice(0, 3);
}

      <div class="muted small" style="margin-top:8px">${T ? (rem >= 0 ? `Quedan ${fmtI(rem)} kcal` : `${fmtI(-rem)} kcal por encima`) : 'Sin objetivo todavía'}</div></div>${ringSvg}</div>
    <div class="mbars">${nutBar('Proteína', tot.p, T?.p, 'g', 'macro')}${nutBar('Carbohidratos', tot.c, T?.c, 'g', 'macro')}${nutBar('Grasa', tot.f, T?.f, 'g', 'macro')}</div>
    <div class="minis"><div class="mini"><span class="label">Fibra</span><span class="v">${fmtI(tot.fib)}${T ? ` <small>/ ${T.fib} g</small>` : ' <small>g</small>'}</span></div>
      <div class="mini"><span class="label">Agua</span><span class="v">${fmtN(wL, 2)}${T ? ` <small>/ ${fmtN(T.water)} L</small>` : ' <small>L</small>'}</span></div>
      <button class="mini" data-act="day" data-date="${d}" style="text-align:left;min-height:0;border-radius:14px;font-weight:400"><span class="label">Pasos</span><span class="v">${stp != null ? (stp >= 1000 ? fmtN(stp / 1000) + 'k' : stp) : '—'} <small>/ ${fmtN(stepGoal() / 1000)}k</small></span></button></div>
    <div class="water"><button class="sm" data-act="water" data-v="250">+ 250 ml</button><button class="sm" data-act="water" data-v="500">+ 500 ml</button><button class="sm" data-act="water" data-v="-250" aria-label="Quitar 250 ml">− 250</button></div></section>`;
  const ins = nutInsights(d, tot, day, T, N);

  // comidas
  const prev = foodOn(dayShift(d, -1));
  h += `<section class="card" style="gap:22px">${MEALS.map(([k, n]) => {
    const its = (day.items || []).filter(i => i.m === k), mt = sumItems(its), pv = (prev?.items || []).filter(i => i.m === k);
    return `<div class="meal"><div class="mh"><span class="nm grow">${n}</span>${its.length ? `<span class="kc">${fmtI(mt.kcal)} kcal · ${fmtI(mt.p)} P</span>` : ''}</div>
      ${its.map(it => { const s = scaleN(it.n, it.g); return `<button class="fi" data-act="fitem" data-id="${esc(it.id)}"><span class="nm">${esc(it.name)}</span><span class="q">${fmtI(it.g)} g · ${fmtI(s.p)} P · ${fmtI(s.c)} C · ${fmtI(s.f)} G</span><span class="k">${fmtI(s.kcal)}</span></button>`; }).join('')}
      <div class="row add"><button class="sm" data-act="fadd" data-m="${k}">+ Añadir</button>${!its.length && pv.length ? `<button class="sm ghost" data-act="fcopy" data-m="${k}" style="color:var(--muted)">Copiar de ayer · ${fmtI(sumItems(pv).kcal)} kcal</button>` : ''}</div></div>`; }).join('')}</section>`;

  h += `<section class="card soft"><details class="more"${S.nutMicros ? ' open' : ''} id="nut-micros"><summary><span><h3>Micronutrientes</h3><span class="small muted">${(day.items || []).length ? `${okN} de ${MICROS.length} en rango` : 'Registra comidas para verlos'}</span></span></summary>
    <div class="mbars" style="margin-top:14px">${nutBar('Azúcares (totales)', tot.sug, null, 'g', 'max')}${nutBar('Grasa saturada', tot.sat, T ? Math.round(T.kcal * 0.1 / 9) : null, 'g', 'max')}
    ${micros.map(([m, v, t]) => nutBar(m[1], v, t, m[2], m[3], t < 20 ? 1 : 0)).join('')}</div>

  const logged = vals.filter(Boolean), mx = Math.max(T?.kcal * 1.15 || 0, ...logged.map(v => v.kcal), 1);
  const avgK = logged.length ? logged.reduce((a, v) => a + v.kcal, 0) / logged.length : null, avgP = logged.length ? logged.reduce((a, v) => a + v.p, 0) / logged.length : null;

      ${T ? `<div class="gl" style="bottom:${(18 + T.kcal / mx * 92).toFixed(0)}px"></div>` : ''}</div>
    <div class="kv"><div><span class="muted">Media de calorías</span><span>${avgK != null ? fmtI(avgK) + ' kcal' : '—'}</span></div>
      <div><span class="muted">Media de proteína</span><span>${avgP != null ? fmtI(avgP) + ' g' : '—'}</span></div>
      ${T ? `<div><span class="muted">Días dentro del ±10 %</span><span>${onT} de ${logged.length}</span></div>` : ''}</div></section>`;
  // objetivo

    const ta = trendAdvice(N), lw = lastBody('weight');
    const eta = N.t.weeks ? ymd(new Date(pd(N.at).getTime() + N.t.weeks * 7 * 864e5)) : null;
    h += `<section class="card"><div class="row between"><h3>Tu plan</h3><button class="sm" data-act="goals">Ajustar</button></div>
      <div class="kv"><div class="hl"><span>${esc(GOALS[N.inp.goal])}</span><span>${N.inp.target ? `${fmtN(lw?.weight ?? N.inp.weight)} → ${fmtN(N.inp.target)} kg` : ''}</span></div>

  h += `<section class="card soft"><details class="more"><summary><h3>En qué se basa</h3></summary><ol class="refs" style="margin-top:12px">

    <li><b>Alimentos:</b> USDA FoodData Central y BEDCA. Orden de prioridades de la pirámide de nutrición de Eric Helms: calorías → macros → micros → horario → suplementos.</li></ol></details></section>`;
  return h;
}

/* --- guardar el día --- */
async function saveFoodDay(d, day, msg) {
  const doc = { date: d, items: day.items || [], water: day.water || 0, updatedAt: Date.now() };
  S.food = { ...S.food, [d]: doc }; scheduleRender();
  return write(db => db.doc('food/' + d).set(doc), msg);
}

  openSheet('Añadir alimento', inner, sh => {
    const list = $('#fp-list', sh);
    const row = (f, i) => `<button class="frow" data-fi="${i}"><span class="nm">${esc(f.name)}${f.brand ? ` <span class="muted small">· ${esc(f.brand)}</span>` : ''}</span><span class="mt">${fmtI(f.n.kcal)} kcal · ${fmtN(f.n.p)} P · ${fmtN(f.n.c)} C · ${fmtN(f.n.f)} G · 100 g</span><span class="pl" aria-hidden="true">+</span></button>`;
    let shown = [];
    const draw = () => {
      const q = norm(st.q).split(' ').filter(Boolean);
      let src = st.q ? allFoods() : st.cat === 'rec' ? recentFoods() : st.cat === 'all' ? allFoods() : allFoods().filter(f => f.cat === st.cat);
      if (q.length) src = src.filter(f => { const n = norm(f.name); return q.every(w => n.includes(w)); })
        .map(f => [f, (norm(f.name).startsWith(q[0]) ? 0 : 1) * 1000 + f.name.length]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
      shown = src.slice(0, 80);
      let html = shown.length ? `<div>${shown.map(row).join('')}</div>` : `<div class="empty">${st.q ? 'No está en la base.' : 'Aún no hay recientes.'}</div>`;
      if (st.q.length >= 3) html += `<button class="sm" id="fp-off" style="margin-top:10px">Buscar «${esc(st.q)}» en productos de marca</button>`;
      if (st.offErr) html += `<p class="small muted" style="margin:8px 0 0">${esc(st.offErr)}</p>`;
      if (st.off) { const base = shown.length; shown = shown.concat(st.off); html += `<div class="sec"><span class="t">Productos de marca · Open Food Facts</span></div><div>${st.off.map((f, i) => row(f, base + i)).join('') || '<div class="empty">Sin resultados.</div>'}</div>`; }
      list.innerHTML = html;
      const ob = $('#fp-off', sh); if (ob) ob.addEventListener('click', () => offSearch(st.q));
    };
    async function offSearch(q) {
      st.offErr = ''; st.off = null; const ob = $('#fp-off', sh); if (ob) { ob.disabled = true; ob.textContent = 'Buscando…'; }
      try {
        const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=code,product_name,product_name_es,brands,nutriments,serving_quantity`;
        const r = await fetch(url); if (!r.ok) throw new Error('http');
        const js = await r.json();
        st.off = (js.products || []).map(offFood).filter(Boolean);
      } catch (e) { st.offErr = 'No se pudo conectar con Open Food Facts. Dentro de Claude esta búsqueda está bloqueada; funciona en la app instalada en el móvil. Mientras, crea el alimento con los datos de la etiqueta.'; }
      draw();
    }
    draw();
    const qi = $('#fp-q', sh);
    qi.addEventListener('input', () => { st.q = qi.value.trim(); st.off = null; st.offErr = ''; draw(); });
    sh.addEventListener('click', ev => {
      const fm = ev.target.closest('[data-fm]'); if (fm) { st.meal = fm.dataset.fm; $('[data-fm]', sh).forEach(b => b.setAttribute('aria-pressed', b === fm)); return; }
      const fc = ev.target.closest('[data-fc]'); if (fc) { st.cat = fc.dataset.fc; $('[data-fc]', sh).forEach(b => b.setAttribute('aria-pressed', b === fc)); draw(); return; }
      const fi = ev.target.closest('[data-fi]'); if (fi) { const f = shown[+fi.dataset.fi]; if (f) openFoodDetail({ food: f, meal: st.meal, date, g: f.lastG || f.portions?.[0]?.g || 100 }); return; }
      if (ev.target.closest('#fp-new')) openFoodCreate(st.meal, date, st.q);
    });
    setTimeout(() => { try { qi.focus({ preventScroll: true }); } catch (e) {} }, 60);
  });
}
function offFood(p) {
  const m = p.nutriments || {}, g = k => Number(m[k + '_100g']);
  const kcal = Number.isFinite(g('energy-kcal')) ? g('energy-kcal') : Number.isFinite(g('energy')) ? g('energy') / 4.184 : null;
  const name = (p.product_name_es || p.product_name || '').trim();
  if (!name || kcal == null) return null;
  const v = (k, mul = 1) => Number.isFinite(g(k)) ? g(k) * mul : 0;
  const n = { kcal, p: v('proteins'), c: v('carbohydrates'), f: v('fat'), fib: v('fiber'), sug: v('sugars'), sat: v('saturated-fat'),
    na: Number.isFinite(g('sodium')) ? g('sodium') * 1000 : v('salt', 400), k: v('potassium', 1000), ca: v('calcium', 1000), fe: v('iron', 1000), mg: v('magnesium', 1000), zn: v('zinc', 1000),
    vc: v('vitamin-c', 1000), vd: v('vitamin-d', 1e6), va: v('vitamin-a', 1e6), b12: v('vitamin-b12', 1e6), fol: v('vitamin-b9', 1e6) };
  const sq = Number(p.serving_quantity);
  return { id: 'off:' + p.code, name, brand: (p.brands || '').split(',')[0].trim(), cat: 'off', n, portions: sq > 0 ? [{ l: '1 porción', g: Math.round(sq) }] : [] };
}

/* --- detalle: cantidad, comida y nutrientes; sirve para añadir y para editar --- */
function openFoodDetail({ food, meal, date, g, item }) {
  const st = { g: g || 100, meal };
  const ports = [...(food.portions || []), { l: '100 g', g: 100 }];
  const inner = `<section class="card" style="gap:14px"><div><span class="label">${esc(FCAT[food.cat] || (food.cat === 'off' ? 'Producto de marca' : 'Alimento'))}</span><h2 style="margin-top:4px">${esc(food.name)}</h2>${food.brand ? `<div class="small muted">${esc(food.brand)}</div>` : ''}</div>
      <div class="qty"><button class="icon" data-q="-" aria-label="Menos">−</button><input id="fd-g" inputmode="decimal" value="${st.g}" aria-label="Gramos"><button class="icon" data-q="+" aria-label="Más">+</button></div>
      <div class="chips">${ports.map(p => `<button data-pg="${p.g}">${esc(p.l)} · ${p.g} g</button>`).join('')}</div>
      <div class="nutgrid" id="fd-n"></div></section>
    <section class="card soft" style="gap:10px"><span class="label">Comida</span><div class="chips">${MEALS.map(([k, n]) => `<button data-fm="${k}" aria-pressed="${k === meal}">${n}</button>`).join('')}</div></section>
    <section class="card soft"><details class="more"><summary><h3>Detalle de nutrientes</h3></summary><div class="kv" id="fd-kv" style="margin-top:8px"></div></details></section>
    <div class="row"><button class="primary grow" id="fd-save">${item ? 'Guardar' : 'Añadir'}</button>${item ? '<button class="danger" id="fd-del">Quitar</button>' : ''}</div>`;
  openSheet(item ? 'Editar alimento' : 'Añadir alimento', inner, sh => {
    const inp = $('#fd-g', sh);
    const paint = () => {
      const s = scaleN(food.n, st.g);
      $('#fd-n', sh).innerHTML = `<div><b>${fmtI(s.kcal)}</b><span>kcal</span></div><div><b>${fmtN(s.p)}</b><span>Prot</span></div><div><b>${fmtN(s.c)}</b><span>Carb</span></div><div><b>${fmtN(s.f)}</b><span>Grasa</span></div>`;
      const rows = [['Fibra', s.fib, 'g', 1], ['Azúcares', s.sug, 'g', 1], ['Grasa saturada', s.sat, 'g', 1], ...MICROS.map(m => [m[1], s[m[0]], m[2], microTarget(m, S.settings.nutri) < 20 ? 1 : 0])];
      $('#fd-kv', sh).innerHTML = rows.map(([n, v, u, dd]) => `<div><span class="muted">${n}</span><span>${dd ? fmtN(v, 1) : fmtI(v)} ${u}</span></div>`).join('');
    };
    paint();
    inp.addEventListener('input', () => { const v = num(inp.value); if (v != null && v >= 0) { st.g = v; paint(); } });
    sh.addEventListener('click', async ev => {
      const q = ev.target.closest('[data-q]'); if (q) { const step = st.g >= 100 ? 25 : 10; st.g = Math.max(0, Math.round((st.g + (q.dataset.q === '+' ? step : -step)) / 5) * 5); inp.value = st.g; paint(); return; }
      const pg = ev.target.closest('[data-pg]'); if (pg) { st.g = +pg.dataset.pg; inp.value = st.g; paint(); return; }
      const fm = ev.target.closest('[data-fm]'); if (fm) { st.meal = fm.dataset.fm; $('[data-fm]', sh).forEach(b => b.setAttribute('aria-pressed', b === fm)); return; }
      if (ev.target.closest('#fd-save')) {
        if (!(st.g > 0)) { toast('Escribe los gramos.'); return; }
        const day = clone(foodOn(date) || { items: [], water: 0 });
        const it = { id: item?.id || uid(), m: st.meal, fid: food.id, name: food.name + (food.brand ? ` (${food.brand})` : ''), g: Math.round(st.g * 10) / 10, n: food.n, cat: food.cat, portions: food.portions || [] };
        if (item) day.items = day.items.map(x => x.id === item.id ? it : x); else day.items.push(it);
        const s = scaleN(food.n, st.g);
        closeSheet();
        await saveFoodDay(date, day, `${item ? 'Guardado' : 'Añadido'} · ${fmtI(s.kcal)} kcal · ${fmtI(s.p)} g proteína`);
        return;
      }
      if (ev.target.closest('#fd-del')) {
        const day = clone(foodOn(date)); day.items = day.items.filter(x => x.id !== item.id);
        closeSheet(); await saveFoodDay(date, day, 'Quitado');
      }
    });
  });
}
function openFoodItem(date, id) {
  const it = (foodOn(date)?.items || []).find(x => x.id === id); if (!it) return;
  const base = allFoods().find(f => f.id === it.fid);
  openFoodDetail({ food: { id: it.fid, name: base?.name || it.name, cat: it.cat || base?.cat, n: it.n, portions: base?.portions || it.portions || [] }, meal: it.m, date, g: it.g, item: it });
}

/* --- alimento propio a partir de la etiqueta --- */
function openFoodCreate(meal, date, name) {
  const F = [['kcal', 'Calorías', 'kcal'], ['p', 'Proteína', 'g'], ['c', 'Carbohidratos', 'g'], ['f', 'Grasa', 'g'], ['fib', 'Fibra', 'g'], ['sug', 'Azúcares', 'g'], ['sat', 'Saturada', 'g'], ['salt', 'Sal', 'g']];
  const inner = `<section class="card soft"><label class="f"><span class="label">Nombre</span><input id="fc-name" value="${esc(name || '')}" placeholder="Ej. Pan proteico Mercadona"></label>
      <div class="fgrid"><label class="f"><span class="label">Valores de la etiqueta por</span><select id="fc-per"><option value="100">100 g / 100 ml</option><option value="p">Porción</option></select></label>
      <label class="f" id="fc-pw" hidden><span class="label">Gramos por porción</span><input id="fc-pg" inputmode="decimal" placeholder="30"></label></div>
      <div class="fgrid">${F.map(([k, n, u]) => `<label class="f"><span class="label">${n} (${u})</span><input id="fc-${k}" inputmode="decimal" placeholder="0"></label>`).join('')}</div>
      <p class="small muted" style="margin:0">Los micronutrientes de alimentos propios cuentan como 0 si la etiqueta no los trae.</p></section>
    <button class="primary" id="fc-save">Guardar y añadir</button>`;
  openSheet('Alimento propio', inner, sh => {
    $('#fc-per', sh).addEventListener('change', e => $('#fc-pw', sh).hidden = e.target.value !== 'p');
    $('#fc-save', sh).addEventListener('click', async () => {
      const nm = $('#fc-name', sh).value.trim(); if (!nm) { toast('Ponle un nombre.'); return; }
      const per = $('#fc-per', sh).value, pg = num($('#fc-pg', sh).value);
      if (per === 'p' && !(pg > 0)) { toast('Escribe cuántos gramos tiene la porción.'); return; }
      const mul = per === 'p' ? 100 / pg : 1, n = {}; NK.forEach(k => n[k] = 0);
      F.forEach(([k]) => { const v = num($(`#fc-${k}`, sh).value) || 0; if (k === 'salt') n.na = v * 400 * mul; else n[k] = Math.round(v * mul * 10) / 10; });
      if (!n.kcal) n.kcal = Math.round(n.p * 4 + n.c * 4 + n.f * 9);
      const id = 'my-' + uid(), doc = { name: nm, n, portions: per === 'p' ? [{ l: '1 porción', g: pg }] : [], createdAt: Date.now() };
      const ok = await write(db => db.doc('foods/' + id).set(doc), 'Alimento guardado');
      if (ok) { S.myFoods = [{ id, ...doc }, ...S.myFoods.filter(f => f.id !== id)]; openFoodDetail({ food: { id, ...doc, cat: 'mine' }, meal, date, g: per === 'p' ? pg : 100 }); }
    });
  });
}

/* --- calculadora de objetivos --- */
function openGoals() {
  const N = S.settings.nutri, lw = lastBody('weight'), lf = lastBody('fat');
  const from = dayShift(today(), -28);
  const recentW = S.workouts.filter(w => w.date >= from && !isJoint(w));
  const liftDef = recentW.length ? Math.round(recentW.reduce((a, w) => a + (w.duration || 60), 0) / 4 / 10) * 10 : 240;

  const stepsDef = stepVals.length ? Math.round(stepVals.reduce((a, b) => a + b) / stepVals.length / 500) * 500 : 8000;

  const opt = (k, opts) => `<div class="opt" role="group">${opts.map(([v, l, s]) => `<button type="button" data-o="${k}" data-v="${v}" aria-pressed="${String(i[k]) === String(v)}">${l}${s ? `<small>${s}</small>` : ''}</button>`).join('')}</div>`;

        <label class="f"><span class="label">Peso actual (kg)</span><input id="g-weight" data-k="weight" inputmode="decimal" value="${i.weight ?? ''}"></label>
        <label class="f"><span class="label">% grasa (opcional)</span><input id="g-bf" data-k="bf" inputmode="decimal" value="${i.bf ?? ''}" placeholder="—"></label></div></section>
    <section class="card soft" style="gap:14px"><span class="label">Objetivo</span>
      <label class="f"><span class="label">Peso objetivo (kg)</span><input id="g-target" data-k="target" inputmode="decimal" value="${i.target ?? ''}" placeholder="opcional"></label>
      ${opt('goal', Object.entries(GOALS).map(([k, n]) => [k, n]))}
      <div id="g-rates"></div></section>
    <section class="card soft" style="gap:14px"><span class="label">Actividad</span>
      <span class="small muted">Día a día sin contar el gimnasio</span>${opt('job', Object.entries(JOBS).map(([k, [n, , s]]) => [k, n, s]))}
      <div class="fgrid"><label class="f"><span class="label">Pasos al día ahora</span><input id="g-steps" data-k="steps" inputmode="numeric" value="${i.steps}"></label>

      <span class="small muted">Proteína (g por kg de peso)</span>${opt('pkg', [[1.6, '1,6'], [1.8, '1,8'], [2, '2,0'], [2.2, '2,2'], [2.4, '2,4']])}</section>

          <div class="hl"><span>Objetivo</span><span>${fmtI(t.kcal)} kcal</span></div></div>

          <p class="small muted" style="margin:0">De abajo arriba: lo que más pesa en tu resultado. Acertar las calorías y la proteína es el 80 % del trabajo.</p></section>`;
    };
    rates(); out();
    sh.addEventListener('input', ev => { const k = ev.target.dataset?.k; if (!k) return; i[k] = num(ev.target.value); if (k === 'weight' && !i.weight) return; out(); });
    sh.addEventListener('click', ev => {
      const b = ev.target.closest('[data-o]'); if (!b) return;
      const k = b.dataset.o, v = b.dataset.v; i[k] = ['rate', 'pkg'].includes(k) ? Number(v) : v;

      const doc = { ...S.settings, nutri, stepGoal: t.steps, heightCm: i.height, weightGoal: i.target || S.settings.weightGoal || null };

/* ---------- sheet ---------- */
let sheetCleanup = null;
function openSheet(title, inner, onMount, extraHead = '') {
  if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
  // fresh node each time so listeners from the previous sheet do not pile up
  const old = $('#sheet'), sh = old.cloneNode(false); old.replaceWith(sh);
  sh.innerHTML = `<div class="in"><div class="head"><h2 class="grow">${esc(title)}</h2>${extraHead}<button class="icon ghost" data-close aria-label="Cerrar">✕</button></div>${inner}</div>`;

    }));
  } else if (isFree) {

        ${(() => { const m = it.m || { m1: 'reps', m2: 'kg' }, none = m.m2 === 'none', k = isKg(m.m2) ? 'w' : 'x', lab = M2[m.m2]?.[0] || 'Kg';
